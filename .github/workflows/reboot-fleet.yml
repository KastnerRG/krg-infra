name: Reboot fleet

# MANUAL ONLY. Reboots every reachable NixOS host in the flake plus the e4e-nas
# Synology appliance, from the self-hosted runner on krg-deploy (the control node
# — same identity the deploy workflow uses). There is no push/schedule trigger: a
# reboot is an explicit, operator-initiated action, never an automatic consequence
# of a commit.
#
# Excluded for now (tracked in #181): krg-deploy (it runs this job)
# and fabricant (the Proxmox hypervisor — rebooting it drops every guest). See
# deploy/reboot-fleet.sh.
on:
  workflow_dispatch:
    inputs:
      hosts:
        description: "Space-separated subset to reboot (blank = all reachable hosts)"
        required: false
        default: ""

# Never overlap with a deploy or another reboot — one control node, one fleet
# action at a time. Don't cancel an in-flight run; a half-finished reboot is worse.
concurrency:
  group: deploy-fleet
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reboot:
    name: Reboot hosts
    runs-on: [self-hosted, krg-deploy]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Reboot fleet
        run: ./deploy/reboot-fleet.sh ${{ github.event.inputs.hosts }}
