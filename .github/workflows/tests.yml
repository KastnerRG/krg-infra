name: Python unit tests

# Unit tests for the control-side Python: the synology_* DSM apply_*.py helpers, the
# drift_detector, and the /scratch overflow selector. Pure stdlib + pytest (+ pyyaml for
# the detector) — no DSM/NAS/ZFS needed, so plain setup-python (not nix) keeps this fast.
# Gates main + PRs like the nix build (build.yml). Enforcement (required status check)
# is a branch-protection setting on KastnerRG/krg-infra — configure it there so a red
# run blocks merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  outline-group-sync:
    name: Outline group sync worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install locked worker and test dependencies
        working-directory: nix/docker-compose/outline-group-sync
        run: uv sync --locked
      - name: Test reconciliation and Temporal workflow
        working-directory: nix/docker-compose/outline-group-sync
        run: uv run --locked pytest -q

  pytest:
    name: pytest (python helpers + drift detector + scratch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          # The DSM apply_*.py helpers run on DSM's Python 3.8; keep the floor there so
          # the tests catch any accidentally-newer syntax.
          python-version: "3.8"

      - name: Install test deps
        run: pip install pytest pyyaml

      - name: Run unit tests
        run: pytest ansible/ drift/ nix/modules/scratch/ nix/modules/security/cve-scan/ nix/modules/services/compose-stack/ -q
