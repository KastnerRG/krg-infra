name: Deploy fleet

# Push-to-main continuous deploy, run on the self-hosted runner on krg-deploy
# (the control node — nix/hosts/krg-deploy/default.nix wires up the runner).
# This turns the nightly pull-based apply (NixOS system.autoUpgrade + the
# krg-deploy ansible-apply timer) into a push-triggered apply.
#
# GATED ON GREEN CI: this never runs on `push` directly. It runs after the
# "Build NixOS configurations" (build.yml), "Python unit tests" (tests.yml), and
# "Lint" (lint.yml) workflows COMPLETE on main, and the gate step below
# additionally confirms that ALL THREE succeeded for the same commit before
# anything touches the fleet — a single workflow_run event only tells us about one
# workflow, so we re-check all three via the API. A broken commit therefore never
# deploys.
#
# MULTISTAGE (control-node self-update, ADR 0011). The deploy is split into three
# jobs so the control node can update ITSELF without the switch killing the job:
#   deploy-pre       (self-hosted) gate + foundation + substrate + secrets, then
#                    BUILD krg-deploy and, if changed, SCHEDULE a detached self-switch.
#   await-selfupdate (GitHub-hosted "cloud machine") wait-loop that watches the
#                    runner drop offline and return online — the barrier that keeps
#                    deploy-post off a control node that is mid-switch. Runs only
#                    when a self-update was actually scheduled.
#   deploy-post      (self-hosted) verify the self-update took, then systems +
#                    config + reconcile + the fleet verify phase.
# See deploy/README.md and deploy/deploy-self-update.sh for the mechanics.
on:
  workflow_run:
    workflows: ["Build NixOS configurations", "Python unit tests", "Lint"]
    types: [completed]

# One deploy at a time — a single control node means no concurrent applies
# (ADR 0005). Don't cancel an in-flight deploy; let it finish.
concurrency:
  group: deploy-fleet
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  # ══ Job 1 — pre-substrate + control-node self-update scheduling ════════════
  deploy-pre:
    name: Apply to fleet (pre + self-update)
    runs-on: [self-hosted, krg-deploy]
    # Fast pre-filter: only a push event (this excludes workflow_dispatch of the CI
    # workflows) on main, and only when the triggering run was green. NOTE: re-runs
    # keep event=push, so this does NOT filter them — that's deliberate. The gate's
    # "head_sha must equal current main head" check is what blocks a re-run from
    # deploying a STALE commit, while still allowing a re-run of the CURRENT commit
    # (e.g. recovering from flaky CI) to deploy — which run_attempt==1 would wrongly
    # forbid. So the no-downgrade guarantee lives in the gate, not here.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    outputs:
      ok: ${{ steps.gate.outputs.ok }}
      selfupdate: ${{ steps.selfupdate.outputs.selfupdate }}
      target: ${{ steps.selfupdate.outputs.target }}
    steps:
      - name: Check out the commit that passed CI
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Confirm ALL required CI workflows succeeded for THIS commit. If not (e.g.
      # another is still running, or failed), skip the apply silently — when the
      # last required workflow finishes green it fires its own deploy run.
      - name: Gate on green CI (all workflows)
        id: gate
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.payload.workflow_run.head_sha;

            // No-downgrade guard: a re-run of an OLD build/tests run fires
            // workflow_run with that old head_sha. Only deploy if it's still the
            // current main head, so a re-run can never roll the fleet backwards.
            const branch = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            const head = branch.data.commit.sha;
            if (sha !== head) {
              core.notice(`${sha} is not current main head (${head}) — skipping (no downgrade).`);
              core.setOutput('ok', 'false');
              return;
            }

            const required = ["Build NixOS configurations", "Python unit tests", "Lint"];
            // octokit's paginate AUTO-normalizes this endpoint and returns the
            // flattened workflow_runs array directly. Do NOT add a map fn like
            // (r) => r.data.workflow_runs: after normalization r.data is ALREADY the
            // array, so that yields undefined per page and the r.name filter below
            // throws "Cannot read properties of undefined". (This bit us once.)
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, head_sha: sha, per_page: 100 });

            // The push-on-main run of each required workflow for this SHA — not a
            // pull_request / workflow_dispatch run of the same commit, which could
            // otherwise satisfy/block the "green CI on push-to-main" guarantee.
            // (Matches the job-level event==push guard.)
            const pick = name => runs
              .filter(r => r.name === name && r.event === 'push' && r.head_branch === 'main')
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
            const picked = required.map(pick);

            let ok = true;
            for (let i = 0; i < required.length; i++) {
              const conclusion = picked[i] ? picked[i].conclusion : 'no push run';
              core.info(`${required[i]}: ${conclusion}`);
              if (!picked[i] || picked[i].conclusion !== 'success') ok = false;
            }
            if (!ok) {
              core.setOutput('ok', 'false');
              core.notice(`Not all required CI green for ${sha} yet — skipping deploy.`);
              return;
            }

            // Exactly-once: deploy fires on the workflow_run of EACH required
            // workflow, so when all are already green the later events would
            // re-apply the same SHA. Only the run that completed LAST proceeds; the
            // earlier events' deploys see a newer sibling and skip. (Until the last
            // CI finishes, the others aren't all green yet, so the ok-check above
            // already skips — no deploy is lost.)
            const last = picked.slice().sort(
              (a, b) => new Date(b.updated_at) - new Date(a.updated_at))[0];
            if (last && last.id !== context.payload.workflow_run.id) {
              core.notice(`Sibling CI run ${last.id} completed later — it owns this deploy; skipping duplicate.`);
              core.setOutput('ok', 'false');
              return;
            }

            core.setOutput('ok', 'true');

      # PHASED PIPELINE (ADR 0011 — docs/adr/0011-cross-layer-deploy-ordering.md).
      # The layers depend on each other in BOTH directions, so no single linear
      # "layer order" satisfies every edge (Ansible NFS exports → NixOS /home, but
      # NixOS AD firewall → Ansible AD join). We resolve it by PHASE, not by
      # reordering whole layers:
      #   phase 0  foundation  NixOS krg-vault + krg-ldap (OpenBao + the AD DC and
      #                        its in-guest firewall) — hoisted ahead of Ansible so
      #                        the shared prerequisite is up first.
      #   phase 1  substrate   Ansible (Proxmox hypervisor, firewall, NFS exports).
      #   phase 1.5 secrets    OpenTofu terraform/secrets (generation before use).
      #   phase 1.9 self-update BUILD krg-deploy; schedule a detached self-switch if
      #                        it changed (this job's tail — see below).
      #   phase 2  systems     NixOS members (deploy-post job).
      #   phase 3  config      OpenTofu configures the services (deploy-post job).
      #   phase 4  verify      ALL membership/health gates, once (deploy-post job).
      #
      # Stage gating: each phase runs only if the gate passed AND every earlier phase
      # succeeded. The explicit success() is load-bearing — a step with a custom if:
      # does not reliably inherit the "previous steps succeeded" default, so without
      # it a failed earlier phase would NOT stop the next. Combined with each script's
      # internal fail-fast, one failed host/target halts the whole deploy.

      # ── phase 0: foundation (NixOS krg-vault + krg-ldap) ──────────────────────
      # krg-ldap carries the in-guest AD firewall the Ansible phase depends on (it
      # opens the DC ports to fabricant); krg-vault brings up OpenBao. Rebuilt BEFORE
      # Ansible — the hoist that removes the NixOS→Ansible back-edge. OEC is staged
      # here too; whether the daemons came up is asserted in phase 4, not now.
      - name: Phase 0 — foundation (NixOS krg-vault + krg-ldap)
        if: success() && steps.gate.outputs.ok == 'true'
        env:
          DEPLOY_NIXOS_HOSTS: "krg-vault krg-ldap"
        run: ./deploy/deploy-nixos.sh

      # ── phase 1: substrate (Ansible) ──────────────────────────────────────────
      # The Proxmox hypervisor (hosts the VMs), the perimeter firewall, and — load-
      # bearing — the NFS exports the compute boxes mount as /home. Ordered AFTER
      # phase 0 so fabricant can already reach the DC through krg-ldap's firewall.
      # AD membership converges in warn-mode here (ad_require_joined default-false);
      # the strict gate is phase 4.
      - name: Phase 1 — substrate (Ansible)
        if: success() && steps.gate.outputs.ok == 'true'
        env:
          DEPLOY_SYNOLOGY: "true"
          DEPLOY_KRG_AD: "true"
        run: ./deploy/deploy-ansible.sh

      # ── phase 1.5: secrets (OpenTofu — early, BEFORE the consumers) ────────────
      # terraform/secrets GENERATES the krg-prod secrets the fail-closed krg.vaultAgent
      # renders in phase 2, so it MUST run before phase 2. It depends only on OpenBao
      # (krg-vault, phase 0) + the krg-deploy AppRole — no running service. Steady
      # state is a no-op; a missing AppRole / unseeded target skips gracefully.
      - name: Phase 1.5 — secrets (OpenTofu)
        if: success() && steps.gate.outputs.ok == 'true'
        env:
          TOFU_STATE_PASSPHRASE: ${{ secrets.TOFU_STATE_PASSPHRASE }}
          TOFU_TARGETS: "secrets"
        run: ./deploy/deploy-tofu.sh

      # ── phase 1.9: control-node self-update (BUILD + schedule; never switch inline)
      # Build krg-deploy from the CI-green checkout and, if it differs from the
      # running system, schedule a DETACHED self-switch (systemd-run --on-active) that
      # outlives this job and the runner restart it causes. Emits selfupdate= and
      # target= for the downstream jobs. Runs LAST in this job so the substrate the
      # control node needs is already in place, and so the switch only fires after
      # this job has reported success. See deploy/deploy-self-update.sh.
      - name: Phase 1.9 — schedule control-node self-update
        id: selfupdate
        if: success() && steps.gate.outputs.ok == 'true'
        run: ./deploy/deploy-self-update.sh

  # ══ Job 2 — external watcher ("cloud machine") ═════════════════════════════
  # Runs on a GitHub-hosted runner because krg-deploy's own runner is the thing
  # going down. Only runs when a self-update was actually scheduled. It watches the
  # runner registration state (offline → online) via the GitHub API — it can't reach
  # krg-deploy directly (firewall). This is the barrier that holds deploy-post until
  # the control node is back. Needs a token with Administration:read (see README).
  await-selfupdate:
    name: Await control-node self-update
    needs: deploy-pre
    if: >-
      needs.deploy-pre.outputs.ok == 'true' &&
      needs.deploy-pre.outputs.selfupdate == 'scheduled'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit that passed CI
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Wait for krg-deploy to return
        env:
          # Administration:read PAT — the default GITHUB_TOKEN cannot read the
          # self-hosted-runners API. Wire this Actions secret before relying on the
          # self-update path (deploy/README.md).
          GH_TOKEN: ${{ secrets.DEPLOY_RUNNER_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./deploy/await-self-update.sh

  # ══ Job 3 — post-substrate (systems + config + verify) ═════════════════════
  # Resumes on the (now-updated) control node. Runs when the gate passed, deploy-pre
  # succeeded, and the watcher either succeeded or was skipped (no self-update).
  # always() is needed so a SKIPPED await-selfupdate doesn't skip this job too.
  deploy-post:
    name: Apply to fleet (systems + config + verify)
    needs: [deploy-pre, await-selfupdate]
    if: >-
      always() &&
      needs.deploy-pre.result == 'success' &&
      needs.deploy-pre.outputs.ok == 'true' &&
      (needs.await-selfupdate.result == 'success' || needs.await-selfupdate.result == 'skipped')
    runs-on: [self-hosted, krg-deploy]
    steps:
      - name: Check out the commit that passed CI
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Safety net: confirm the scheduled self-update actually took (a detached
      # switch can't fail the job that scheduled it, and the watcher only proves the
      # runner returned — not that it's on the RIGHT generation). Fails the deploy if
      # krg-deploy is running anything other than the target deploy-pre built.
      - name: Verify control-node self-update
        env:
          DEPLOY_SELF_TARGET: ${{ needs.deploy-pre.outputs.target }}
        run: ./deploy/deploy-self-verify.sh

      # ── phase 2: systems (NixOS members) ──────────────────────────────────────
      # The remaining hosts now that the substrate exists: the service hosts (krg-prod,
      # which OpenTofu configures in phase 3; e4e-prod, the student-tenant edge; krg-nat,
      # the Incus platform host that runs the tenant instances) and the compute boxes,
      # which mount /home from phase 1's NFS exports. OEC staged here; daemons verified in
      # phase 4.
      - name: Phase 2 — systems (NixOS members)
        env:
          DEPLOY_NIXOS_HOSTS: "krg-prod e4e-prod krg-nat waiter kastner-ml"
        run: ./deploy/deploy-nixos.sh

      # ── phase 3: config (OpenTofu) ────────────────────────────────────────────
      # State is local on krg-deploy (ADR 0005) + encrypted with the
      # TOFU_STATE_PASSPHRASE Actions secret. Creds come from OpenBao (krg-deploy
      # AppRole). authentik applies before grafana (grafana reads the grafana-oidc
      # authentik produces). `incus` reconciles the platform boundary (incusbr0 +
      # profiles + tenant projects/instances) — cert-based auth, no special token; it
      # depends on the one-time openbao bootstrap having added the incus-client role.
      # An unseeded/unreachable target skips with a notice. openbao is NOT listed — it
      # needs a privileged bootstrap token and is applied manually.
      - name: Phase 3 — config (OpenTofu)
        env:
          TOFU_STATE_PASSPHRASE: ${{ secrets.TOFU_STATE_PASSPHRASE }}
          TOFU_TARGETS: "authentik grafana e4e-nas temporal incus"
        run: ./deploy/deploy-tofu.sh

      # ── phase 3.5: reconcile phase-3-generated secrets into their consumers ────
      # The lone secret that can only exist after phase 3 is an Authentik OUTPOST
      # token (Authentik mints it). This re-runs openbao-agent on krg-prod so the
      # now-present tokens render and the reloadCommands restart the outpost
      # containers — a from-scratch deploy converges both outposts in ONE run.
      # Best-effort (warns, never fails): steady state is a no-op.
      - name: Phase 3.5 — reconcile generated secrets (outpost tokens)
        run: ./deploy/deploy-rerender-secrets.sh

      # ── phase 4: verify (all health/membership gates, once) ───────────────────
      # The SINGLE verification phase — runs AFTER every layer has converged, for the
      # whole fleet: OEC daemons (Qualys + Trellix) on every host + the control node,
      # and AD machine-keytab membership (`adcli testjoin`) on every configured
      # member. FATAL here. DEPLOY_VERIFY_AD=false is the first-bring-up escape hatch.
      - name: Phase 4 — verify fleet (OEC + AD membership)
        run: ./deploy/deploy-verify.sh
