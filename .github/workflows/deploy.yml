name: Deploy fleet

# Push-to-main continuous deploy, run on the self-hosted runner on krg-deploy
# (the control node — nix/hosts/krg-deploy/default.nix wires up the runner).
# This turns the nightly pull-based apply (NixOS system.autoUpgrade + the
# krg-deploy ansible-apply timer) into a push-triggered apply.
#
# GATED ON GREEN CI: this never runs on `push` directly. It runs after the
# "Build NixOS configurations" (build.yml), "Python unit tests" (tests.yml), and
# "Lint" (lint.yml) workflows COMPLETE on main, and the gate step below
# additionally confirms that ALL THREE succeeded for the same commit before
# anything touches the fleet — a single workflow_run event only tells us about one
# workflow, so we re-check all three via the API. A broken commit therefore never
# deploys.
on:
  workflow_run:
    workflows: ["Build NixOS configurations", "Python unit tests", "Lint"]
    types: [completed]

# One deploy at a time — a single control node means no concurrent applies
# (ADR 0005). Don't cancel an in-flight deploy; let it finish.
concurrency:
  group: deploy-fleet
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Apply to fleet
    runs-on: [self-hosted, krg-deploy]
    # Fast pre-filter: only a push event (this excludes workflow_dispatch of the CI
    # workflows) on main, and only when the triggering run was green. NOTE: re-runs
    # keep event=push, so this does NOT filter them — that's deliberate. The gate's
    # "head_sha must equal current main head" check is what blocks a re-run from
    # deploying a STALE commit, while still allowing a re-run of the CURRENT commit
    # (e.g. recovering from flaky CI) to deploy — which run_attempt==1 would wrongly
    # forbid. So the no-downgrade guarantee lives in the gate, not here.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Check out the commit that passed CI
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Confirm ALL required CI workflows succeeded for THIS commit. If not (e.g.
      # another is still running, or failed), skip the apply silently — when the
      # last required workflow finishes green it fires its own deploy run.
      - name: Gate on green CI (all workflows)
        id: gate
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.payload.workflow_run.head_sha;

            // No-downgrade guard: a re-run of an OLD build/tests run fires
            // workflow_run with that old head_sha. Only deploy if it's still the
            // current main head, so a re-run can never roll the fleet backwards.
            const branch = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            const head = branch.data.commit.sha;
            if (sha !== head) {
              core.notice(`${sha} is not current main head (${head}) — skipping (no downgrade).`);
              core.setOutput('ok', 'false');
              return;
            }

            const required = ["Build NixOS configurations", "Python unit tests", "Lint"];
            // octokit's paginate AUTO-normalizes this endpoint and returns the
            // flattened workflow_runs array directly. Do NOT add a map fn like
            // (r) => r.data.workflow_runs: after normalization r.data is ALREADY the
            // array, so that yields undefined per page and the r.name filter below
            // throws "Cannot read properties of undefined". (This bit us once.)
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, head_sha: sha, per_page: 100 });

            // The push-on-main run of each required workflow for this SHA — not a
            // pull_request / workflow_dispatch run of the same commit, which could
            // otherwise satisfy/block the "green CI on push-to-main" guarantee.
            // (Matches the job-level event==push guard.)
            const pick = name => runs
              .filter(r => r.name === name && r.event === 'push' && r.head_branch === 'main')
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
            const picked = required.map(pick);

            let ok = true;
            for (let i = 0; i < required.length; i++) {
              const conclusion = picked[i] ? picked[i].conclusion : 'no push run';
              core.info(`${required[i]}: ${conclusion}`);
              if (!picked[i] || picked[i].conclusion !== 'success') ok = false;
            }
            if (!ok) {
              core.setOutput('ok', 'false');
              core.notice(`Not all required CI green for ${sha} yet — skipping deploy.`);
              return;
            }

            // Exactly-once: deploy fires on the workflow_run of EACH required
            // workflow, so when all are already green the later events would
            // re-apply the same SHA. Only the run that completed LAST proceeds; the
            // earlier events' deploys see a newer sibling and skip. (Until the last
            // CI finishes, the others aren't all green yet, so the ok-check above
            // already skips — no deploy is lost.)
            const last = picked.slice().sort(
              (a, b) => new Date(b.updated_at) - new Date(a.updated_at))[0];
            if (last && last.id !== context.payload.workflow_run.id) {
              core.notice(`Sibling CI run ${last.id} completed later — it owns this deploy; skipping duplicate.`);
              core.setOutput('ok', 'false');
              return;
            }

            core.setOutput('ok', 'true');

      # Stage gating: each deploy stage runs only if the gate passed AND every
      # earlier stage succeeded. The explicit success() is load-bearing — a step
      # with a custom if: does not reliably inherit the "previous steps succeeded"
      # default, so without it a failed earlier stage would NOT stop the next one.
      # Combined with each script's own internal fail-fast, one failed host/target
      # halts the whole deploy.
      #
      # STAGE ORDER = dependency order: Ansible → NixOS → OpenTofu.
      #   1. Ansible provisions the substrate the OS hosts CONSUME: the Proxmox
      #      hypervisor (hosts the VMs), the firewall, and — load-bearing here — the
      #      NFS exports the NixOS compute boxes mount as /home (waiter <- fabricant
      #      rpool/nfs/home; kastner-ml <- e4e-nas e4e-home). If this ran AFTER NixOS,
      #      a compute box's home.mount would fail on the very deploy meant to create
      #      its export — and fail-fast would then SKIP this Ansible stage, so the
      #      export never lands: a deadlock.
      #   2. NixOS brings up the machines + the services (Authentik, Grafana,
      #      OpenBao) that run on them.
      #   3. OpenTofu configures those services via their APIs and reads/writes
      #      OpenBao secrets — so it MUST come last, after the services exist.
      - name: Apply Ansible layer
        if: success() && steps.gate.outputs.ok == 'true'
        env:
          # Include e4e-nas in the converge. Inert until krg-deploy's OpenBao
          # AppRole creds are provisioned (graceful skip otherwise — see
          # deploy/deploy-ansible.sh).
          #
          # FULL converge (no SYNOLOGY_TAGS). The bring-up scoping (#165) is lifted:
          # a read-only `--check --diff` of the whole playbook came back clean —
          # 0 failures, 0 deletions (including the declarative-delete roles
          # shares/acls/nfs/app_portal/quotas — spec is reconciled with live), and
          # only benign config drift on roles already proven on a real apply. SNMP
          # stays disabled in spec (#151) and mail deferred in group_vars (#163);
          # those are role-internal gates, not tag scoping.
          DEPLOY_SYNOLOGY: "true"
          # Converge KRG.LOCAL Active Directory structure (ansible/krg-ad/, ADR
          # 0010) too — its gate block already exists in deploy-ansible.sh, but
          # without this flag the new subtree never runs in the fleet deploy. No
          # secrets needed (structural only); the apply is non-authoritative
          # (adds, never deletes) so it can't clobber roster-set human group
          # membership. Requires krg-deploy to reach krg-ldap over SSH as
          # krg-admin (host key in known_hosts) — same push model as fabricant.
          DEPLOY_KRG_AD: "true"
        run: ./deploy/deploy-ansible.sh

      # Stages the campus-mandated OEC (Qualys + Trellix) installer to each host and
      # verifies both security daemons are active — the deploy FAILS if the archive
      # is missing on the control node or any host's daemons aren't up (#22). The
      # credentialed archive is staged out-of-band at
      # /var/lib/krg-admin/.secrets/oec-qualystrellixinstallers-linux.tgz (see
      # deploy/README.md "OEC"); override with OEC_INSTALLER if elsewhere. The same
      # OEC gate applied to the Proxmox hosts in the Ansible step above.
      - name: Deploy NixOS hosts
        if: success() && steps.gate.outputs.ok == 'true'
        run: ./deploy/deploy-nixos.sh

      # OpenTofu layer. State is local on krg-deploy (ADR 0005) + encrypted with
      # the TOFU_STATE_PASSPHRASE Actions secret. Creds come from OpenBao (krg-deploy
      # AppRole) — no secrets on disk. WHICH targets apply is the explicit opt-in
      # below (like SYNOLOGY_TAGS scopes the synology converge): TOFU_TARGETS is
      # empty, so this is INERT until a target is listed AND its KV secret is seeded
      # (an unseeded listed target skips with a notice). openbao is NOT listed here —
      # it needs a privileged bootstrap token and is applied manually (see
      # deploy/deploy-tofu.sh header). Widen this as each target's service + KV
      # secret come online. See deploy/README.md "OpenTofu".
      - name: Apply OpenTofu layer
        if: success() && steps.gate.outputs.ok == 'true'
        env:
          TOFU_STATE_PASSPHRASE: ${{ secrets.TOFU_STATE_PASSPHRASE }}
          # authentik mints the OIDC client secrets (and roster passwords) and
          # writes them back into OpenBao — krg-deploy's AppRole policy was widened
          # to manage exactly those paths (terraform/openbao/main.tf). It applies
          # before grafana because grafana reads the grafana-oidc authentik produces
          # — so grafana MUST stay ordered after authentik here. An unseeded target
          # (authentik: no authentik-admin-token / -bind in KV; grafana: no
          # grafana-admin / grafana-oidc) skips with a notice, so listing it is safe
          # ahead of seeding. openbao is NOT listed — it needs a privileged bootstrap
          # token and is applied manually (see deploy/deploy-tofu.sh header).
          #
          # temporal manages namespaces on the krg-prod cluster; deploy-tofu.sh's
          # temporal) case mints a short-lived temporal-client cert from the lab CA
          # (krg-deploy AppRole holds the issue grant) to reach the mTLS frontend.
          # Prereqs: openbao applied (the PKI role + grant) and krg-prod up with the
          # frontend reachable on :7233 — both land in earlier stages / manual openbao.
          # A missing AppRole token skips it gracefully; a failed apply halts the deploy.
          TOFU_TARGETS: "authentik grafana e4e-nas temporal"
        run: ./deploy/deploy-tofu.sh
