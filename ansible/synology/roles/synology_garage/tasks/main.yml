---
# synology_garage — deploy + configure Garage S3 on Container Manager from
# spec/e4e-nas/garage.yml. THREE steps in load-bearing order:
#   1. render-config  — write /volume1/docker/garage/garage.toml (root:root 0400)
#                       from spec.config + 3 extra_vars secrets (no_log:true).
#   2. deploy         — render docker-compose.yml + `docker compose up -d`
#                       when image/mounts/env/restart drift. Container would
#                       crash-loop without step 1 → strict ordering.
#   3. layout         — single-node `garage layout assign` + `apply`. Idempotent
#                       after first apply; anti-rebalance guard refuses to
#                       mutate an already-defined layout (capacity bumps are
#                       operator-driven, not auto-applied).
#
# ARCHITECTURAL NOTE: this role replaces terraform's `synology_container_project`
# for Garage. The terraform provider hit three distinct bugs against DSM's
# SYNO.Docker.Project API in one session (#110/#113/#114) — see
# docs/adr/0007-dsm-config-ansible-not-terraform.md "Garage retreat". We
# invoke `docker compose` directly (the underlying primitive); container
# still shows in DSM Container Manager's Container tab.
#
# CROSS-REFERENCE: terraform/e4e-nas/containers.tf creates three
# `synology_filestation_folder` resources for the FileStation paths
# /docker/garage and /s3-data/{meta,data} — DSM's FileStation API only
# sees dirs created through itself, so any container bind-mount source
# needs index-registration. The mapping from those FileStation paths to
# on-disk absolute paths (which volume hosts the `docker` and `s3-data`
# shares) is whatever DSM's share catalogue says; this role takes the
# resolved disk paths via spec (`compose_path`, `config_path`, `meta_dir`,
# `data_dir`) and assumes they already exist on disk + are FileStation-
# tracked. If you change which volume hosts a share, update both the
# share spec AND these path fields in spec/e4e-nas/garage.yml.

# `tags: [always]` so the spec is loaded regardless of which tag filter the
# operator invokes the role with. Without this, `--tags=garage_ui` (or any
# other sub-tag we might add later) would skip this include_vars and the
# downstream tasks would crash on undefined `garage_spec`.
- name: Load the Garage spec
  ansible.builtin.include_vars:
    file: "{{ synology_garage_spec }}"
    name: garage_spec
  tags: [always]

# --- Anti-error guard: secrets must be supplied as extra_vars ------------------
# render-config carries no_log:true (it's the task that actually injects the
# secrets via GARAGE_* environment), so a missing var would surface as
# "AnsibleUndefinedVariable" with no value (good — but the error site would
# be inside a no_log task, hiding the cause). deploy + layout don't see the
# secrets and aren't no_log. Fail loudly here, before anything secret-bearing
# runs.
#
# Tagged with `garage_ui` and `garage_data` too because both render-ui-config
# AND sync-buckets/sync-keys depend on `garage_admin_token` via their own
# `environment:` blocks — so `--tags=garage_ui` / `--tags=garage_data` alone
# should each hit the same guard, not skip past it into a no_log-shrouded
# task and fail there with a hidden AnsibleUndefinedVariable.
- name: Refuse to deploy Garage without secrets in extra_vars
  ansible.builtin.assert:
    that:
      - garage_rpc_secret    | default('') | length >= 32
      - garage_admin_token   | default('') | length >= 32
      - garage_metrics_token | default('') | length >= 32
    fail_msg: >-
      Garage requires extra_vars: garage_rpc_secret, garage_admin_token,
      garage_metrics_token (each at least 32 chars). Supply via
      `-e @~/.config/krg/secrets-garage.yml` (operator-local, mode 0600,
      outside the repo). Generate with `openssl rand -hex 32`. #110
      (OpenBao migration) eventually replaces this with a vault-backed
      lookup.
  tags: [garage_ui, garage_data]

# --- 1. garage.toml ------------------------------------------------------------
# Secrets pass via ENVIRONMENT (not cmdline argv) — argv is visible to other
# processes on the NAS via `ps`/`top`/`/proc/<pid>/cmdline` even for the
# brief window the script runs, so cmdline secrets would leak to local
# users despite ansible's no_log. apply_garage.py reads GARAGE_* env vars
# directly (os.environ). no_log:true keeps secret values out of ansible's
# stdout-capture machinery too. The script's stdout payload deliberately
# omits secret values; it only reports `desired_sha256` (the rendered
# config's hash) so the operator can confirm a meaningful change without
# the bytes leaking.
- name: Render garage.toml (atomic write, root:root 0400)
  ansible.builtin.script: >-
    apply_garage.py render-config
    --config-path {{ garage_spec.deployment.config_path | quote }}
    --meta-dir {{ garage_spec.deployment.meta_dir | quote }}
    --data-dir {{ garage_spec.deployment.data_dir | quote }}
    --db-engine {{ garage_spec.config.db_engine | quote }}
    --replication-factor {{ garage_spec.config.replication_factor }}
    --compression-level {{ garage_spec.config.compression_level }}
    --rpc-bind-addr {{ garage_spec.config.rpc_bind_addr | quote }}
    --rpc-public-addr {{ garage_spec.config.rpc_public_addr | quote }}
    --s3-api-bind-addr {{ garage_spec.config.s3_api.api_bind_addr | quote }}
    --s3-region {{ garage_spec.config.s3_api.region | quote }}
    --s3-root-domain {{ garage_spec.config.s3_api.root_domain | quote }}
    --s3-web-bind-addr {{ garage_spec.config.s3_web.bind_addr | quote }}
    --s3-web-root-domain {{ garage_spec.config.s3_web.root_domain | quote }}
    --s3-web-index {{ garage_spec.config.s3_web.index | quote }}
    --admin-api-bind-addr {{ garage_spec.config.admin.api_bind_addr | quote }}
    {{ '--check' if ansible_check_mode else '' }}
  environment:
    GARAGE_RPC_SECRET: "{{ garage_rpc_secret }}"
    GARAGE_ADMIN_TOKEN: "{{ garage_admin_token }}"
    GARAGE_METRICS_TOKEN: "{{ garage_metrics_token }}"
  register: cfg_apply
  changed_when: "'CHANGED' in cfg_apply.stdout or 'WOULD-CHANGE' in cfg_apply.stdout"
  failed_when: "cfg_apply.rc != 0 or 'FAIL' in cfg_apply.stdout"
  check_mode: false
  no_log: true

# --- 2. container ---------------------------------------------------------------
- name: Deploy Garage container (docker compose up -d on drift)
  ansible.builtin.script: >-
    apply_garage.py deploy
    --compose-path {{ garage_spec.deployment.compose_path | quote }}
    --container-name {{ garage_spec.deployment.container_name | quote }}
    --image {{ garage_spec.deployment.image | quote }}
    --image-tag {{ garage_spec.deployment.image_tag | quote }}
    --network-mode {{ garage_spec.deployment.network_mode | quote }}
    --restart-policy {{ garage_spec.deployment.restart_policy | quote }}
    --meta-dir {{ garage_spec.deployment.meta_dir | quote }}
    --data-dir {{ garage_spec.deployment.data_dir | quote }}
    --config-path {{ garage_spec.deployment.config_path | quote }}
    --rust-log {{ garage_spec.deployment.rust_log | quote }}
    {{ '--check' if ansible_check_mode else '' }}
  register: deploy_apply
  changed_when: "'CHANGED' in deploy_apply.stdout or 'WOULD-CHANGE' in deploy_apply.stdout"
  failed_when: "deploy_apply.rc != 0 or 'FAIL' in deploy_apply.stdout"
  check_mode: false

# --- 3. cluster layout ----------------------------------------------------------
# After first apply this is a one-shot: layout version stays at 1 forever
# (single node, no capacity drift permitted from the spec). Re-runs no-op.
- name: Bootstrap Garage cluster layout (single-node, anti-rebalance)
  ansible.builtin.script: >-
    apply_garage.py layout
    --container-name {{ garage_spec.deployment.container_name | quote }}
    --zone {{ garage_spec.cluster.zone | quote }}
    --capacity {{ garage_spec.cluster.capacity | quote }}
    {{ '--check' if ansible_check_mode else '' }}
  register: layout_apply
  changed_when: "'CHANGED' in layout_apply.stdout or 'WOULD-CHANGE' in layout_apply.stdout"
  failed_when: "layout_apply.rc != 0 or 'FAIL' in layout_apply.stdout"
  check_mode: false

# --- 4. buckets + keys (sub-PR 5 of #101) ---------------------------------------
# Uses the Garage v2 Admin API (JSON, loopback — see apply_garage.py's
# _admin_request), not the CLI: `layout` predates the v2 admin API and still
# parses `garage` CLI text; buckets/keys don't need to carry that debt.
# sync-buckets before sync-keys: a key's bucket grants need the bucket to
# already exist (do_sync_keys FAILs loudly otherwise, rather than guessing
# an ordering fix).
- name: Sync Garage buckets (create-if-missing)
  # Bucket names are pulled out into a task `vars:` (rather than inlined with
  # `map(attribute='name')` on the script line below) so the free-form command
  # string itself has no literal `=` in it — ansible-lint's no-free-form check
  # otherwise misreads `attribute='name'` as a stray module k=v argument.
  vars:
    garage_bucket_names: "{{ garage_spec.buckets | default([]) | map(attribute='name') | list }}"
  ansible.builtin.script: >-
    apply_garage.py sync-buckets
    --admin-port {{ garage_spec.config.admin.api_bind_addr.split(':')[-1] }}
    --buckets-json {{ garage_bucket_names | to_json | quote }}
    {{ '--check' if ansible_check_mode else '' }}
  environment:
    GARAGE_ADMIN_TOKEN: "{{ garage_admin_token }}"
  register: buckets_apply
  changed_when: "'CHANGED' in buckets_apply.stdout or 'WOULD-CHANGE' in buckets_apply.stdout"
  failed_when: "buckets_apply.rc != 0 or 'FAIL' in buckets_apply.stdout"
  check_mode: false
  no_log: true
  tags: [garage_data]

- name: Sync Garage keys + per-bucket grants
  # NOTE: `garage_spec.get('keys', ...)`, NOT `garage_spec.keys`. Jinja resolves
  # dotted access as an attribute before a dict item, so `garage_spec.keys`
  # returns the dict's built-in `.keys` METHOD (a `builtin_function_or_method`
  # that `to_json` can't serialize — "Object of type ... is not JSON
  # serializable"), never the spec's `keys:` list. `.get('keys', [])` dodges the
  # collision and yields [] if the section is absent. (The buckets task above is
  # safe from this only because `dict` has no `.buckets` method.)
  ansible.builtin.script: >-
    apply_garage.py sync-keys
    --admin-port {{ garage_spec.config.admin.api_bind_addr.split(':')[-1] }}
    --keys-json {{ garage_spec.get('keys', []) | to_json | quote }}
    --keys-dir {{ garage_spec.deployment.keys_dir | quote }}
    {{ '--check' if ansible_check_mode else '' }}
  environment:
    GARAGE_ADMIN_TOKEN: "{{ garage_admin_token }}"
    # Per-key {access_key_id, secret_access_key} the control node provisioned in
    # OpenBao (secret/e4e-nas/garage-keys/<name>) and passed as the
    # garage_key_credentials extra_var — env, NOT argv (same posture as the admin
    # token). apply_garage.py IMPORTS keys from these + renders <name>.env from
    # them, so OpenBao is the durable source of truth (#75). deploy-ansible.sh
    # builds it; an operator local run supplies it in the -e @… secrets file.
    GARAGE_KEY_CREDENTIALS_JSON: "{{ garage_key_credentials | to_json }}"
  register: keys_apply
  changed_when: "'CHANGED' in keys_apply.stdout or 'WOULD-CHANGE' in keys_apply.stdout"
  # Do NOT fail HERE. This task is no_log (its `environment:` carries the admin
  # token + key creds), so a failure here shows only "censored" — which has hidden
  # every sync-keys error behind an opaque wall. Defer the failure to the next
  # task, which surfaces the reason. apply_garage.py's FAIL payload is secret-free
  # by design (reason/status/Garage-error-body/key+bucket NAMES only — see its
  # module docstring), so echoing stdout leaks nothing.
  failed_when: false
  check_mode: false
  no_log: true
  tags: [garage_data]

- name: Surface a Garage sync-keys failure (payload is secret-free by design)
  when: "keys_apply.rc != 0 or 'FAIL' in (keys_apply.stdout | default(''))"
  ansible.builtin.fail:
    msg: >-
      garage sync-keys FAILED (rc={{ keys_apply.rc | default('?') }}):
      {{ keys_apply.stdout | default('') }} {{ keys_apply.stderr | default('') }}
  tags: [garage_data]

# --- 5. admin UI (Noooste/garage-ui) -------------------------------------------
# Skipped entirely when the spec has no `ui:` block (opt-in surface). Requires
# one MORE extra_var beyond the cluster secrets: garage_ui_oidc_client_secret.
# Same security model as the cluster secrets: env vars only, no_log:true.
#
# Run UI-only with `--tags=garage_ui` (e.g. image bumps that don't touch
# the cluster). The compose / config dirs are FileStation-tracked by terraform
# (see terraform/e4e-nas/containers.tf `synology_filestation_folder.docker_garage_ui`).
- name: Refuse to deploy garage-ui without OIDC client secret
  ansible.builtin.assert:
    that:
      - garage_ui_oidc_client_secret | default('') | length >= 16
    fail_msg: >-
      Garage UI requires extra_var: garage_ui_oidc_client_secret
      (Authentik OIDC client secret, ≥ 16 chars). Supply via
      `-e @~/.config/krg/secrets-garage.yml`. The first-time setup
      (create Authentik provider+application, copy the secret) is
      documented in roles/synology_garage/README.md "First-time UI setup".
  when: garage_spec.ui is defined
  tags: [garage_ui]

- name: Render garage-ui config.yaml (atomic write, root:root 0400)
  ansible.builtin.script: >-
    apply_garage.py render-ui-config
    --config-path {{ garage_spec.ui.config_path | quote }}
    --bind-host {{ garage_spec.ui.bind_host | quote }}
    --port {{ garage_spec.ui.port }}
    --public-hostname {{ garage_spec.ui.public_hostname | quote }}
    --public-url {{ garage_spec.ui.public_url | quote }}
    --garage-s3-port {{ garage_spec.config.s3_api.api_bind_addr.split(':')[-1] }}
    --garage-admin-port {{ garage_spec.config.admin.api_bind_addr.split(':')[-1] }}
    --garage-region {{ garage_spec.config.s3_api.region | quote }}
    --oidc-provider-name {{ garage_spec.ui.oidc.provider_name | quote }}
    --oidc-client-id {{ garage_spec.ui.oidc.client_id | quote }}
    --oidc-issuer-url {{ garage_spec.ui.oidc.issuer_url | quote }}
    --oidc-role-attribute-path {{ garage_spec.ui.oidc.role_attribute_path | quote }}
    --oidc-scopes-json {{ garage_spec.ui.oidc.scopes | to_json | quote }}
    --oidc-admin-roles-json {{ garage_spec.ui.oidc.admin_roles | to_json | quote }}
    {{ '--check' if ansible_check_mode else '' }}
  environment:
    GARAGE_ADMIN_TOKEN: "{{ garage_admin_token }}"
    GARAGE_UI_OIDC_CLIENT_SECRET: "{{ garage_ui_oidc_client_secret }}"
  register: ui_cfg_apply
  changed_when: "'CHANGED' in ui_cfg_apply.stdout or 'WOULD-CHANGE' in ui_cfg_apply.stdout"
  failed_when: "ui_cfg_apply.rc != 0 or 'FAIL' in ui_cfg_apply.stdout"
  check_mode: false
  no_log: true
  when: garage_spec.ui is defined
  tags: [garage_ui]

- name: Deploy garage-ui container (docker compose up -d on drift)
  ansible.builtin.script: >-
    apply_garage.py deploy-ui
    --compose-path {{ garage_spec.ui.compose_path | quote }}
    --container-name {{ garage_spec.ui.container_name | quote }}
    --image {{ garage_spec.ui.image | quote }}
    --image-tag {{ garage_spec.ui.image_tag | quote }}
    --config-path {{ garage_spec.ui.config_path | quote }}
    {{ '--config-changed' if (ui_cfg_apply is defined and ui_cfg_apply is changed) else '' }}
    {{ '--check' if ansible_check_mode else '' }}
  register: ui_deploy_apply
  changed_when: "'CHANGED' in ui_deploy_apply.stdout or 'WOULD-CHANGE' in ui_deploy_apply.stdout"
  failed_when: "ui_deploy_apply.rc != 0 or 'FAIL' in ui_deploy_apply.stdout"
  check_mode: false
  when: garage_spec.ui is defined
  tags: [garage_ui]
