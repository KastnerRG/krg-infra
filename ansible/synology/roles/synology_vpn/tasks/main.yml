---
# synology_vpn — OpenVPN remote access for off-campus SMB, from
# spec/e4e-nas/vpn.yml. The tunnel terminates ON the NAS so clients reach this
# box and nothing else; see the spec for the threat model.
#
# Logic in files/apply_vpn.py via the `script` module (DSM py3.8 is below
# ansible's module floor — [[synology-script-raw-pattern]]).
#
# ORDER CONSTRAINT: synology_base runs this LAST, after synology_ad — the
# privilege grant references domain principals (KRG\Domain Users), so the box
# must already be joined.
#
# TWO-LAYER ISOLATION, and neither layer lives entirely here:
#   1. `allow_lan: false` (this role)  — DSM never enables ip_forward/MASQUERADE
#      or pushes a LAN route. apply_vpn.py hard-refuses a true value.
#   2. the `vpn` firewall adapter (synology_security, spec/e4e-nas/security.yml)
#      — default-drop + one 445/tcp allow. THAT is what stops a VPN client from
#      reaching the DSM UI / SSH / Garage on this same box.
# Changing the tunnel subnet here means changing `vpn-smb-only`'s source_ip
# there too. They are deliberately not derived from one another (the firewall
# spec is consumed by a different role); keep them in sync by hand.

- name: Load the VPN spec
  ansible.builtin.include_vars:
    file: "{{ synology_vpn_spec }}"
    name: vpn_spec

# The package is installed by terraform (terraform/e4e-nas/packages.tf), but DSM
# leaves VPN Server STOPPED until a protocol is enabled — and while stopped its
# webapi libs are not registered, so every SYNO.VPNServer.* call returns err 102.
# Start it before anything else or the rest of this role fails misleadingly.
- name: Ensure the VPNCenter package is running
  ansible.builtin.script: >-
    apply_vpn.py package
    {{ '--check' if ansible_check_mode else '' }}
  register: vpn_pkg
  changed_when: "'CHANGED' in vpn_pkg.stdout or 'WOULD-CHANGE' in vpn_pkg.stdout"
  failed_when: "vpn_pkg.rc != 0 or 'FAIL' in vpn_pkg.stdout"
  check_mode: false
  when: synology_vpn_enabled | default(false) | bool

- name: Configure the OpenVPN server
  ansible.builtin.script: >-
    apply_vpn.py openvpn
    --enable {{ vpn_spec.openvpn.enable | default(false) }}
    --port {{ vpn_spec.openvpn.port | default(1194) }}
    --protocol {{ vpn_spec.openvpn.protocol | default('udp') }}
    --subnet {{ vpn_spec.openvpn.subnet }}
    --max-connections {{ vpn_spec.openvpn.max_connections | default(20) }}
    --allow-lan {{ vpn_spec.openvpn.allow_lan | default(false) }}
    --ipv6 {{ vpn_spec.openvpn.ipv6 | default(false) }}
    --cipher {{ vpn_spec.openvpn.cipher }}
    --auth-digest {{ vpn_spec.openvpn.auth_digest }}
    --compression {{ vpn_spec.openvpn.compression | default(false) }}
    --tls-auth {{ vpn_spec.openvpn.tls_auth | default(true) }}
    {{ "--check" if ansible_check_mode else "" }}
  register: vpn_conf
  changed_when: "'CHANGED' in vpn_conf.stdout or 'WOULD-CHANGE' in vpn_conf.stdout"
  failed_when: "vpn_conf.rc != 0 or 'FAIL' in vpn_conf.stdout"
  check_mode: false
  when:
    - synology_vpn_enabled | default(false) | bool

# Settings.Config.apply writes serv_enable but does NOT start the daemon — a
# freshly-applied box sits at serv_enable=True / serv_run=False with nothing
# bound. This bounces the package only when the config says up and the daemon
# is down, so a converged box is a no-op.
- name: Start the OpenVPN daemon if the config enables it
  ansible.builtin.script: >-
    apply_vpn.py service
    {{ '--check' if ansible_check_mode else '' }}
  register: vpn_svc
  changed_when: "'CHANGED' in vpn_svc.stdout or 'WOULD-CHANGE' in vpn_svc.stdout"
  failed_when: "vpn_svc.rc != 0 or 'FAIL' in vpn_svc.stdout"
  check_mode: false
  when: synology_vpn_enabled | default(false) | bool

# Point vpnauthd's RADIUS at the AD directory. WITHOUT THIS the VPN is closed to
# everyone: a fresh VPNCenter install leaves `syno_conf/rad_site_def` on the
# local-accounts site (only `vpn_updater`, which runs on package UPGRADE, ever
# switches it), so every AD login is rejected as "Incorrect user name" — and the
# privilege task below has correctly denied all four local accounts. Found the
# hard way on the first off-campus test, 2026-08-25; see spec/e4e-nas/vpn.yml.
#
# Runs AFTER `service`: it bounces vpnauthd via radiusd.sh force-restart, whose
# start branch is a no-op unless a protocol is already enabled.
- name: Point the VPN's RADIUS at the AD directory
  ansible.builtin.script: >-
    apply_vpn.py auth
    --backend {{ vpn_spec.auth.backend | default('ad') }}
    --domain {{ vpn_spec.auth.domain | default('') | quote }}
    {{ '--check' if ansible_check_mode else '' }}
  register: vpn_auth
  changed_when: "'CHANGED' in vpn_auth.stdout or 'WOULD-CHANGE' in vpn_auth.stdout"
  failed_when: "vpn_auth.rc != 0 or 'FAIL' in vpn_auth.stdout"
  check_mode: false
  when: synology_vpn_enabled | default(false) | bool

# Deny every LOCAL account access to the VPN. Management.Account enumerates
# local accounts ONLY (total=4 on this AD-joined box), so there is nothing to
# GRANT here — AD users are admitted by the RADIUS/ntlm_auth path with no
# allowlist in front of it. What DSM does expose is the local accounts, and it
# ships them all ENABLED: e4e-admin and e4e-automation are active
# `administrators`, so leaving this off means two admin accounts with a
# password-authenticated internet front door. See spec/e4e-nas/vpn.yml.
#
# Uses the explicit `cmd:` form rather than free-form: the `map(attribute=...)`
# filter contains an `=`, which ansible-lint's no-free-form rule reads as a
# key=value module arg.
- name: Deny local accounts VPN access (no AD surface exists to grant on)
  ansible.builtin.script:
    cmd: >-
      apply_vpn.py privilege
      --deny-local {{ vpn_spec.openvpn.privilege.deny_local | default(["all"]) | to_json | quote }}
      {{ "--check" if ansible_check_mode else "" }}
  register: vpn_priv
  when:
    - synology_vpn_enabled | default(false) | bool
    - synology_vpn_privilege_enabled | default(false) | bool
  changed_when: "'CHANGED' in vpn_priv.stdout or 'WOULD-CHANGE' in vpn_priv.stdout"
  failed_when: "vpn_priv.rc != 0 or 'FAIL' in vpn_priv.stdout"
  check_mode: false

# Publish the client config into a share so users can self-serve it. With
# tls_auth on, the .ovpn embeds ta.key and IS a shared secret — the `installers`
# share is RO to @users and RW only to admins, so it reaches exactly the
# population allowed to use the VPN (every AD user) and no wider.
#
# No chicken-and-egg: a user with no tunnel can still fetch it from off campus
# through DSM's web UI / File Station, which security.yml keeps reachable
# US-wide (`geoip-US-web`). If that rule is ever narrowed, move this file first.
- name: Publish the client .ovpn to the distribution share
  ansible.builtin.script: >-
    apply_vpn.py publish
    --host {{ vpn_spec.client.public_host }}
    --vpn-ip {{ vpn_spec.client.vpn_ip }}
    --port {{ vpn_spec.openvpn.port | default(1194) }}
    --protocol {{ vpn_spec.openvpn.protocol | default('udp') }}
    --cipher {{ vpn_spec.openvpn.cipher }}
    --auth-digest {{ vpn_spec.openvpn.auth_digest }}
    --tls-auth {{ vpn_spec.openvpn.tls_auth | default(true) }}
    --dest {{ vpn_spec.client.publish_to }}
    {{ '--check' if ansible_check_mode else '' }}
  register: vpn_pub
  when:
    - synology_vpn_enabled | default(false) | bool
    - vpn_spec.client.publish | default(true) | bool
  changed_when: "'CHANGED' in vpn_pub.stdout or 'WOULD-CHANGE' in vpn_pub.stdout"
  failed_when: "vpn_pub.rc != 0 or 'FAIL' in vpn_pub.stdout"
  check_mode: false

# --- Schema capture (read-only, cannot fail the deploy) ------------------------
# OFF by default now that the schema is known and mapped. Kept because it is
# what broke the err-600 deadlock: it proved the failure was not transport-
# related, which is what sent us hunting for a missing parameter. Flip
# synology_vpn_discover on for one deploy the next time DSM returns something
# inexplicable — it only READS and always exits 0, so it cannot break anything.
#
# The password goes via `environment:` rather than argv so the task does NOT need
# no_log — which matters, because the whole point is to get the payload into the
# deploy log where it can be read. Secret-looking values are redacted in the
# script before printing.
#
# TEMPORARY: flip synology_vpn_discover to false once OUT_KEYS is reconciled.
- name: Dump the live VPNServer schema (read-only)
  ansible.builtin.script:
    cmd: apply_vpn.py dump
  register: vpn_dump
  changed_when: false
  failed_when: false      # belt: the script already always exits 0
  check_mode: false
  when:
    - synology_vpn_discover | default(true) | bool

- name: Show the captured VPNServer schema
  ansible.builtin.debug:
    var: vpn_dump.stdout_lines
  when: vpn_dump.stdout_lines | default([]) | length > 0

# --- Drift export (read-only) — only with `--tags export` ---------------------
- name: Export live state for drift detection
  ansible.builtin.import_tasks: export.yml
  tags: [export, never]
