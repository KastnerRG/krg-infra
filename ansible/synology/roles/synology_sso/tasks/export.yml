---
# Exporter (read-only): snapshot the live DSM OIDC SSO config so the
# drift_detector can diff it against spec/e4e-nas/sso.yml. Paired half of the role
# (ADR 0001 — UI = drift). Run: ansible-playbook playbook.yml --tags export
#
# Two APIs mirror apply_sso.py: SYNO.Core.Directory.OIDC.SSO (the profile) and
# SYNO.Core.Directory.SSO.Setting (the default-login toggle).

- name: Ensure the export dir exists on the control node
  ansible.builtin.file:
    path: "{{ synology_export_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  run_once: true

- name: Get live DSM OIDC SSO profile
  ansible.builtin.raw: "PATH={{ syno_path }}:$PATH synowebapi --exec api=SYNO.Core.Directory.OIDC.SSO method=get version=1"
  register: oidc_get
  changed_when: false
  check_mode: false
  failed_when: false

- name: Get live DSM SSO activation (sso_profile + sso_enable)
  ansible.builtin.raw: "PATH={{ syno_path }}:$PATH synowebapi --exec api=SYNO.Core.Directory.SSO.Profile method=get version=1"
  register: activate_get
  changed_when: false
  check_mode: false
  failed_when: false

- name: Get live DSM SSO default-login setting
  ansible.builtin.raw: "PATH={{ syno_path }}:$PATH synowebapi --exec api=SYNO.Core.Directory.SSO.Setting method=get version=1"
  register: setting_get
  changed_when: false
  check_mode: false
  failed_when: false

- name: Write the live-state snapshot
  ansible.builtin.copy:
    dest: "{{ synology_export_dir }}/{{ inventory_hostname }}-sso.yml"
    mode: "0600"
    content: |
      # Live DSM OIDC SSO state on {{ inventory_hostname }} — synology_sso exporter.
      # raw synowebapi output (preamble on stderr; stdout is the JSON pretty-print).
      # NOTE: DSM's OIDC GET returns oidc_client_secret in plaintext — treat this
      # snapshot as sensitive (mode 0600) and do not commit it.
      oidc_raw: {{ oidc_get.stdout_lines | default([]) | to_json }}
      activate_raw: {{ activate_get.stdout_lines | default([]) | to_json }}
      setting_raw: {{ setting_get.stdout_lines | default([]) | to_json }}
  delegate_to: localhost
