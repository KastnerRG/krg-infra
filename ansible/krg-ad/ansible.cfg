# Ansible config for the KRG.LOCAL Active Directory management subtree.
#
# Self-contained: role, playbook, inventory, group_vars are ALL under this dir,
# mirroring ansible/synology/. Decommission = `rm -rf ansible/krg-ad/`.
#
# Run from this dir:
#   cd ansible/krg-ad
#   ansible-playbook playbook.yml --check --diff   # dry run (reports drift)
#   ansible-playbook playbook.yml                  # converge
#
# Targets krg-ldap over SSH as the break-glass krg-admin (become root). samba-tool
# runs on the DC. See README.md.
[defaults]
inventory           = inventory.yml
roles_path          = roles
host_key_checking   = True
retry_files_enabled = False
stdout_callback     = default
result_format       = yaml
interpreter_python  = auto_silent
forks               = 5

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s
