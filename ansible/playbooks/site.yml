# krg-infra — make managed hosts secure + up to date by default.
#
#   ansible-galaxy collection install -r ../requirements.yml
#   ansible-playbook playbooks/site.yml --check    # dry run first
#   ansible-playbook playbooks/site.yml
#
# SAFETY: keep a Proxmox console session open the first time, and verify you can
# open a NEW key-based ssh session before closing your current one.
- name: Baseline (secure + up to date by default)
  hosts: all
  become: true
  roles:
    # The full baseline lives in the `base` role: OS basics (timezone, packages,
    # unattended upgrades, sysctl) PLUS the security + monitoring stack it composes
    # in order — krg_admin, ssh_hardening, fail2ban, monitoring, oec_qualys_trellix,
    # ad_client. See roles/base/tasks/main.yml. Set `oec_installer` to enroll
    # Qualys/Trellix; pass `-e ad_join_password=...` the first time to join the AD.
    - base

# Proxmox/PVE perimeter firewall (source restriction; pairs with the in-guest
# NixOS firewall). cluster.fw IPSets come from the shared nix/networks/trusted.json.
- name: Proxmox perimeter firewall
  hosts: proxmox
  become: true
  roles:
    - proxmox_firewall      # cluster.fw + per-guest <vmid>.fw

# Hypervisor-side per-VM metrics (prometheus-pve-exporter → pve_* via the PVE API).
# The complement of the in-guest node_exporter: Proxmox's accounting of each guest
# (alloc vs used, balloon, per-VMID disk/net I/O). The scrape port (9221) is opened
# to the monitoring host in each PVE host's host.fw (proxmox_host_fw_rules in
# host_vars). See issue #235.
- name: Proxmox per-VM metrics (prometheus-pve-exporter)
  hosts: proxmox
  become: true
  roles:
    - pve_exporter

# Web-UI SSO via Authentik OpenID Connect: a PVE realm + the proxmox-admins group
# (Administrator on /), with membership group-synced from the Authentik `groups`
# claim (AD "Proxmox Admins"). The realm step no-ops unless the Authentik client
# secret is supplied — deploy/deploy-ansible.sh materializes it from OpenBao
# (secret/krg-prod/proxmox-oidc) and passes pve_oidc_client_secret. Authentik is the
# pre-selected default realm, but PAM stays in the dropdown so break-glass logins
# survive a directory outage. See docs/proxmox-sso.md.
- name: Proxmox web-UI SSO (Authentik OIDC realm)
  hosts: proxmox
  become: true
  roles:
    - pve_oidc

# Let's Encrypt cert for the PVE web UI (pveproxy :8006) via PVE-native ACME,
# HTTP-01 standalone. Opt-in per host (the cert domain is host-specific): runs only
# where proxmox_acme_enable is true, with domain/contact/environment in host_vars.
# Port 80 (the HTTP-01 challenge) is opened by the proxmox_firewall play ABOVE
# (proxmox_host_fw_rules), so it's in place before this orders. Renewal is PVE's own
# pve-daily-update timer — nothing scheduled here. STAGING-FIRST: bring up against LE
# staging, verify, then flip proxmox_acme_environment=production and re-run.
- name: Proxmox web-UI TLS (Let's Encrypt via PVE ACME)
  hosts: proxmox
  become: true
  roles:
    - role: proxmox_acme
      when: proxmox_acme_enable | default(false)

# Storage — exports backed by a ZFS dataset on the hypervisor's pool, plus the pool
# capacity policy (cap VM storage so user data wins contention). Deliberately
# host-scoped to `fabricant` (NOT the `proxmox` group): other PVE hosts must not
# expose this NFS. Pool/shares/clients/quotas live in host_vars/fabricant.yml. The
# NFS port (tcp/2049) is opened in fabricant's per-node host.fw via the
# proxmox_firewall play above (proxmox_host_fw_rules in host_vars).
- name: Storage — ZFS limits + NFS server (fabricant only)
  hosts: fabricant
  become: true
  roles:
    - zfs_limits      # cap VM disk storage (rpool/data) so user/NFS data wins
    - nfs_server      # NFSv4 exports on rpool/nfs (home + scratch-krg)
