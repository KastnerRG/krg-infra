# SSH hardening — disable password auth (the breach vector) and shrink root login.
#
# CROSS-REFERENCE: mirrors the SSH policy in nix/profiles/base.nix
# (services.openssh, PermitRootLogin "no"). The PVE divergence is now narrow: root
# SSH is OFF globally and re-permitted (key-only) ONLY from ssh_root_allowed_sources
# (the control node + admin remotes), because PVE relies on root SSH for cluster
# inter-node ops and the Ansible push connects as root. HUMANS get NO direct root —
# they log in as their AD account or the krg-admin break-glass user and sudo (per-user
# attribution, smaller root surface). ed25519-only stays opt-in (cluster inter-node
# SSH may use RSA keys).
#
# Order matters: keys are authorized BEFORE password auth is turned off.
- name: Refuse to run without an authorized key (anti-lockout guard)
  ansible.builtin.assert:
    that:
      - admin_ssh_keys | length > 0
    fail_msg: >-
      admin_ssh_keys is empty. Disabling password auth without an authorized key
      would lock you out. Set the keys in nix/keys/admins.json first.

# Split admin_ssh_keys into the deploy automation identity (the ONLY key that may
# root in — the control node pushes Ansible as root) and the human keys (revoked
# from root). The deploy key is matched by its comment (ssh_deploy_key_marker).
- name: Identify the deploy automation key vs the human keys
  ansible.builtin.set_fact:
    ssh_root_keys: "{{ admin_ssh_keys | select('search', ssh_deploy_key_marker) | list }}"
    ssh_root_revoked_keys: "{{ admin_ssh_keys | reject('search', ssh_deploy_key_marker) | list }}"

- name: Refuse to run unless the deploy key is uniquely identified (anti-lockout)
  ansible.builtin.assert:
    that:
      - ssh_root_keys | length == 1
    fail_msg: >-
      Expected exactly one admin key whose comment matches
      '{{ ssh_deploy_key_marker }}' (the control-node deploy identity that roots in);
      found {{ ssh_root_keys | length }}. Check nix/keys/admins.json.

- name: Authorize ONLY the deploy automation key for root
  ansible.posix.authorized_key:
    user: root
    key: "{{ ssh_root_keys | join('\n') }}"
    state: present
    exclusive: false

# Remove the human admin keys from root (they authenticate as krg-admin or their AD
# account, then sudo). state: absent is surgical — it leaves root's own host key and
# any PVE cluster key untouched (unlike exclusive: true, which would strip them).
- name: Revoke human admin keys from root
  ansible.posix.authorized_key:
    user: root
    key: "{{ item }}"
    state: absent
  loop: "{{ ssh_root_revoked_keys }}"

- name: Install hardened sshd drop-in
  ansible.builtin.template:
    src: 10-krg-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-krg-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Validate and restart sshd
