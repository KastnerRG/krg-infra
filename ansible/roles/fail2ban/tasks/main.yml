# Brute-force banning — mitigates the dictionary-attack class that caused the
# breach. CROSS-REFERENCE: counterpart of the NixOS krg.fail2ban module
# (nix/modules/security/fail2ban.nix); keep ban policy roughly aligned.
#
# fail2ban_enabled gate: SUPERSEDED on the fleet by the `crowdsec` role.
# Both bans into iptables; running both at once creates race conditions
# (each writes its own chain with its own TTLs). Default flipped to FALSE
# in group_vars/all.yml so the role is a no-op fleet-wide; can be re-
# enabled per-host if CrowdSec misbehaves there. Same one-cycle-rollback
# pattern as the NixOS layer (nix/profiles/base.nix). Remove the role
# entirely once CrowdSec has cooked in prod for a quarter.
- name: Fail2ban (gated)
  when: fail2ban_enabled
  block:
    - name: Install fail2ban
      ansible.builtin.apt:
        name: fail2ban
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Configure fail2ban (jail.local)
      ansible.builtin.template:
        src: jail.local.j2
        dest: /etc/fail2ban/jail.local
        owner: root
        group: root
        mode: "0644"
      notify: Restart fail2ban

    - name: Enable and start fail2ban
      ansible.builtin.service:
        name: fail2ban
        enabled: true
        state: started

# When fail2ban_enabled is false on a host that was previously running
# fail2ban: stop + disable the service so it can't race with the CrowdSec
# bouncer on iptables (both stacks write their own ban chains; a leftover
# running fail2ban would create exactly the race this PR's switch was
# designed to avoid). Leave the package INSTALLED so flipping the var
# back to true is a fast rollback (re-enable + re-start, no apt fetch).
# Package purge stays operator-driven once we're confident in CrowdSec.
- name: Fail2ban (disabled) — stop + disable but keep package for fast rollback
  when: not fail2ban_enabled
  block:
    - name: Read installed-package facts (idempotency guard)
      ansible.builtin.package_facts:
        manager: apt

    - name: Stop + disable fail2ban (only if previously installed)
      ansible.builtin.systemd_service:
        name: fail2ban
        enabled: false
        state: stopped
      when: "'fail2ban' in ansible_facts.packages"
