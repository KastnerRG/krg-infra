# Default ON in this role (preserves long-standing behavior in isolation).
# Fleet-wide default is FLIPPED to false in group_vars/all.yml since
# CrowdSec (roles/crowdsec) supersedes it; see the gating note in
# tasks/main.yml.
fail2ban_enabled: true

fail2ban_bantime: "1h"
fail2ban_findtime: "10m"
fail2ban_maxretry: 3
fail2ban_ignoreip:
  - "127.0.0.1/8"
  - "::1"
