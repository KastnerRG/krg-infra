# krg-infra base role — the full "secure + up to date by default" baseline that
# EVERY managed host gets. It does two things:
#   1. OS baseline       — timezone, packages (incl tmux), unattended security
#                          upgrades, sysctl.
#   2. Security + monitoring baseline — composes krg_admin, ssh_hardening,
#                          crowdsec, monitoring, oec_qualys_trellix, and ad_client
#                          (AD enrollment — every host joins KRG.LOCAL) (below).
#
# CROSS-REFERENCE: this is the Proxmox/Debian counterpart of the NixOS baseline
# profile nix/profiles/base.nix, which likewise bundles SSH hardening + CrowdSec +
# OEC + node-exporter onto every host. When you change the baseline on EITHER side
# (timezone, packages, auto-updates, sysctl, OR which security/monitoring concerns
# are default), apply the equivalent change to the other. Platform differences are
# expected and fine.
#
# The security/monitoring roles are composed with import_role (not meta
# dependencies) so base's own OS tasks run FIRST and the krg_admin -> ssh_hardening
# ordering stays explicit and auditable — see the anti-lockout note below.

# --- 1. OS baseline ---------------------------------------------------------
- name: Set timezone
  community.general.timezone:
    name: "{{ base_timezone }}"

- name: Install baseline packages (incl. tmux + unattended-upgrades)
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Remove unwanted packages
  ansible.builtin.apt:
    name: "{{ base_packages_absent }}"
    state: absent

- name: Enable unattended security upgrades (up to date by default)
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/apt/apt.conf.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - 20auto-upgrades
    - 50unattended-upgrades

- name: Apply sysctl settings
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop: "{{ base_sysctl | dict2items }}"

# earlyoom: kill the worst memory hog early before the kernel OOM killer livelocks
# the box under sustained pressure. Mirrors nix profiles/base.nix services.earlyoom.
# The package is installed via base_packages above; here we set the LOW thresholds
# and disable systemd-oomd so two OOM managers don't fight (oomd's PSI accounting
# also fights ZFS ARC). See base_earlyoom_args for the threshold rationale.
- name: Configure earlyoom thresholds
  ansible.builtin.copy:
    dest: /etc/default/earlyoom
    content: |
      # Managed by krg-infra ansible base role — DO NOT EDIT.
      # Mirrors nix profiles/base.nix services.earlyoom.
      EARLYOOM_ARGS="{{ base_earlyoom_args }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart earlyoom

- name: Enable and start earlyoom
  ansible.builtin.systemd_service:
    name: earlyoom
    enabled: true
    state: started

- name: Disable systemd-oomd (don't run two OOM managers; PSI fights ARC accounting)
  ansible.builtin.systemd_service:
    name: systemd-oomd
    enabled: false
    state: stopped
    masked: true
  # systemd-oomd may not be installed on a given host; absence is fine, not a failure.
  failed_when: false

# --- 2. Security + monitoring baseline (every host) -------------------------
# ORDER IS LOAD-BEARING: krg_admin creates the named, key-only sudo admin BEFORE
# ssh_hardening turns password auth off. This repo exists because a host's root
# SSH was dictionary-attacked — do NOT reorder krg_admin after ssh_hardening, or a
# run with no authorized key would lock you out. (Both roles also assert a key is
# present and ssh_hardening validates `sshd -t` before restart, but keep the order.)
- name: Break-glass admin (before the SSH lockdown)
  ansible.builtin.import_role:
    name: krg_admin

- name: SSH hardening (password auth off, root key-only)
  ansible.builtin.import_role:
    name: ssh_hardening

# CrowdSec is the sole brute-force/ban layer (community CTI + local ssh-bf
# scenarios). It installs + registers + starts before the fail2ban cleanup
# below so a host is never left without brute-force protection: if CrowdSec
# fails to come up, the play fails BEFORE any fail2ban teardown runs.
- name: CrowdSec (community CTI + local scenarios — the ban layer)
  ansible.builtin.import_role:
    name: crowdsec

# TOMBSTONE — fail2ban was removed fleet-wide (superseded by CrowdSec). The
# `fail2ban` role is gone; this block converges hosts that ran it before the
# switch to a clean no-fail2ban state (stop + disable + purge the package so
# it can't race the CrowdSec bouncer on iptables). Idempotent + a no-op on
# hosts that never had it. Safe to delete once the whole fleet has applied a
# post-removal run (target: 2026-Q4).
- name: Fail2ban removed — ensure absent (transitional cleanup)
  block:
    - name: Read installed-package facts (idempotency guard)
      ansible.builtin.package_facts:
        manager: apt

    - name: Stop + disable + purge fail2ban (only if present)
      when: "'fail2ban' in ansible_facts.packages"
      block:
        - name: Stop + disable fail2ban
          ansible.builtin.systemd_service:
            name: fail2ban
            enabled: false
            state: stopped

        - name: Purge the fail2ban package + its jail config
          ansible.builtin.apt:
            name: fail2ban
            state: absent
            purge: true

- name: Monitoring (node + ipmi exporters) — on every host by default
  ansible.builtin.import_role:
    name: monitoring

- name: Endpoint security (campus-mandated Qualys + Trellix)
  ansible.builtin.import_role:
    name: oec_qualys_trellix

# AD enrollment runs LAST: krg_admin/ssh_hardening have already guaranteed a local
# key-only break-glass admin, so even a misconfigured access filter can't lock you
# out (local users bypass SSSD). The one-time join needs `-e ad_join_password=...`;
# without it on an un-joined host the role stages config + warns (never fails).
- name: Active Directory client (SSSD) — every host joins the AD
  ansible.builtin.import_role:
    name: ad_client
