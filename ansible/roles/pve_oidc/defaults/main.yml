# PVE web-UI SSO via Authentik OpenID Connect (issue: Proxmox SSO).
#
# Configures a PVE OpenID Connect realm pointing at the Authentik `proxmox`
# application (terraform/authentik). PVE is the OIDC client; on each login it
# reads the `groups` claim and sets the user's PVE group membership (PVE 8.2
# group-sync), so AD group "Proxmox Admins" → PVE group `proxmox-admins` →
# Administrator on `/`. See docs/proxmox-sso.md.
#
# Authentik is the DEFAULT login realm (pve_oidc_default_realm = true): the login
# screen pre-selects it. This does NOT remove the other realms — Linux PAM stays in
# the dropdown, so break-glass `root@pam` / `krg-admin` is always reachable by
# switching the selector. During an Authentik/AD outage an admin just picks PAM
# manually; nobody is locked out of the hypervisor.

pve_oidc_realm: "authentik" # realm id in /etc/pve/domains.cfg (cluster-wide)
pve_oidc_issuer_url: "https://auth.krg.ucsd.edu/application/o/proxmox/"
pve_oidc_client_id: "proxmox"

# Authentik-minted client secret. EMPTY by default: the realm step no-ops unless a
# secret is supplied (same model as oec_installer), so `--check`/local runs and a
# control node without OpenBao creds still converge the rest. The CD path
# (deploy/deploy-ansible.sh) AppRole-reads it from secret/krg-prod/proxmox-oidc and
# passes it (plus client_id/issuer_url) as extra-vars.
pve_oidc_client_secret: ""

# PVE username-claim selector: `username` maps to the token's preferred_username
# (Authentik's profile scope → the AD sAMAccountName). `subject` or `email` also
# valid. autocreate makes the PVE user object on first successful login.
pve_oidc_username_claim: "username"
# Requested OIDC scopes. `groups` is REQUIRED for group-sync below: PVE only
# receives the `groups` claim if it asks for the `groups` scope, and the proxmox
# provider's groups mapping (terraform/authentik) is keyed on that scope. Without
# it the claim is absent and `groups-overwrite` wipes the user's PVE groups every
# login → nobody lands in proxmox-admins → no admin. (openid is implied/prepended
# by PVE; listed for clarity.)
pve_oidc_scopes: "openid email profile groups"
pve_oidc_autocreate: true
pve_oidc_default_realm: true # pre-select Authentik on the login screen (PAM still in the dropdown)

# Group-sync (PVE 8.2+). When on, the realm reads the `groups` claim and OVERWRITES
# the user's PVE group membership each login (groups-autocreate off — we pre-create
# the admin group below with its ACL). Set false on a pre-8.2 PVE (then grant ACL
# another way). The Authentik proxmox_groups scope emits PVE-safe ids.
pve_oidc_groups_sync: true

# The PVE group SSO admins land in, and the role it gets on `/`. Pre-created here
# (with the ACL) so group-sync only has to populate membership.
pve_oidc_admin_pve_group: "proxmox-admins"
pve_oidc_admin_pve_role: "Administrator"
