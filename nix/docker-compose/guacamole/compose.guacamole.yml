# Apache Guacamole — clientless remote-desktop / SSH / RDP / VNC gateway at
# remote.krg.ucsd.edu. Standalone compose stack (NOT include'd into the krg-prod
# stack) so its dependency on the OpenBao-rendered DB secret fails closed for
# Guacamole ALONE — a bao outage must not take down authentik/grafana/vaultwarden/
# traefik. Wired by nix/hosts/krg-prod/default.nix (krg.composeStacks.guacamole).
#
# Two auth gates (defense-in-depth):
#   - OUTER: Authentik forward-auth (the `authentik` Traefik middleware, defined by
#     the authentik_proxy container in the krg-prod stack) — no unauthenticated
#     request reaches Tomcat. Requires the guacamole forward-auth proxy provider on
#     the outpost (terraform/authentik).
#   - INNER: Guacamole's native OpenID Connect (implicit flow, no client_secret) —
#     cryptographic identity + the Guacamole session. The Postgres DB holds the
#     connection inventory + per-user authz.
#
# Secret: the ONLY runtime secret is the Postgres password, rendered by the OpenBao
# Agent to /run/krg/guacamole/guacamole.env (tmpfs) — see krg.vaultAgent. No
# .secrets/ file. The OIDC endpoints/client-id below are public (implicit flow).

services:
  guacd:
    image: guacamole/guacd:1.6.0
    container_name: guacd
    restart: unless-stopped
    networks: [guacamole_internal]

  guacamole:
    image: guacamole/guacamole:1.6.0
    container_name: guacamole
    restart: unless-stopped
    environment:
      # Serve at the root context so the URL is https://remote.krg.ucsd.edu/
      # (not /guacamole). The OIDC redirect URI below must match this base.
      WEBAPP_CONTEXT: ROOT
      GUACD_HOSTNAME: guacd
      # Postgres JDBC backend (POSTGRESQL_ prefix auto-enables the JDBC extension;
      # POSTGRESQL_PASSWORD comes from the rendered env_file).
      POSTGRESQL_HOSTNAME: guacamole_postgres
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_USERNAME: guacamole
      # OpenID Connect → Authentik (OPENID_ prefix auto-enables the SSO extension).
      # enable-environment-properties maps each OPENID_FOO_BAR → openid-foo-bar.
      # Implicit flow → no client secret is used.
      OPENID_AUTHORIZATION_ENDPOINT: https://auth.krg.ucsd.edu/application/o/authorize/
      OPENID_JWKS_ENDPOINT: https://auth.krg.ucsd.edu/application/o/guacamole/jwks/
      OPENID_ISSUER: https://auth.krg.ucsd.edu/application/o/guacamole/
      OPENID_CLIENT_ID: guacamole
      OPENID_REDIRECT_URI: https://remote.krg.ucsd.edu/
      # Username = email claim (matches the Authentik provider sub_mode=user_email,
      # consistent with grafana/outline).
      OPENID_USERNAME_CLAIM_TYPE: email
      OPENID_SCOPE: openid email profile
    env_file:
      # POSTGRESQL_PASSWORD (+ POSTGRES_PASSWORD for the db container), rendered by
      # the OpenBao Agent from secret/krg-prod/guacamole. tmpfs; never on disk.
      - /run/krg/guacamole/guacamole.env
    depends_on:
      guacamole_postgres:
        condition: service_healthy
    networks:
      - guacamole_internal
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.guacamole.rule=Host(`remote.krg.ucsd.edu`)"
      - "traefik.http.routers.guacamole.entrypoints=websecure"
      - "traefik.http.routers.guacamole.tls.certresolver=letsencrypt"
      # OUTER gate: the `authentik` forward-auth middleware is defined by the
      # authentik_proxy container (krg-prod stack); Traefik aggregates labels across
      # compose projects, so referencing it here works. Needs the guacamole_gate
      # proxy provider on the outpost (terraform/authentik/outpost.tf).
      - "traefik.http.routers.guacamole.middlewares=authentik"
      - "traefik.http.services.guacamole.loadbalancer.server.port=8080"

  guacamole_postgres:
    image: postgres:16
    container_name: guacamole_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole
      # POSTGRES_PASSWORD provided by the rendered env_file (same value as
      # POSTGRESQL_PASSWORD above).
    env_file:
      - /run/krg/guacamole/guacamole.env
    volumes:
      - guacamole_pgdata:/var/lib/postgresql/data
      # Schema (committed, generated by guacamole/bin/initdb.sh --postgresql).
      # Postgres runs /docker-entrypoint-initdb.d/*.sql once, on first init only.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "guacamole", "-d", "guacamole_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [guacamole_internal]

volumes:
  guacamole_pgdata:

networks:
  guacamole_internal: {}
  traefik_proxy:
    external: true
