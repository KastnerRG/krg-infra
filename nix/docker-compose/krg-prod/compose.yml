include:
  - compose.authentik.yml
  - compose.grafana.yml
  - compose.vaultwarden.yml
  # Guacamole + Temporal were standalone compose projects, justified by scoping
  # their OpenBao dependency. That isolation was illusory — every bao-backed stack
  # shares the single openbao-agent oneshot's fate — so they're folded into this
  # one project: one stack, one bao dependency, easier to reason about.
  - compose.guacamole.yml
  - compose.temporal.yml
  - compose.mlflow.yml
  # Temporarily disabled — bring up once verified.
  # - compose.outline.yml

services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: always
    ports:
      # Public ingress — bound to all interfaces explicitly. The krg.docker daemon
      # default binds unspecified publishes to loopback (so DBs/exporters don't leak
      # past the firewall); 80/443 must override that to serve the perimeter.
      - 0.0.0.0:80:80
      - 0.0.0.0:443:443
      # 8080 (Traefik API/dashboard) intentionally NOT published — it would expose
      # the API on the host's external interface. Prometheus metrics are served on a
      # SEPARATE, also-unpublished entrypoint (metrics :8082, see command below) and
      # scraped by Prometheus as traefik:8082 over the traefik_proxy docker network
      # (prometheus joined that network in compose.grafana.yml).
      # - 8080:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-data/letsencrypt:/letsencrypt:z
    command:
      - "--log.level=INFO"
      # - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.web.http.redirections.entryPoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.forwardedHeaders.insecure=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=e4e@ucsd.edu"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      # - "--certificatesresolvers.letsencrypt.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
      - "--providers.docker.network=traefik_proxy"
      # Prometheus metrics on a dedicated internal entrypoint (:8082, NOT in the
      # ports: list above, so it never reaches the host's external interface).
      # Scraped over the docker network as traefik:8082 — see the 'traefik' job in
      # prometheus/prometheus.yml. addEntryPointsLabels/addServicesLabels enrich the
      # series (per-entrypoint + per-service request/latency breakdowns).
      - "--entrypoints.metrics.address=:8082"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=metrics"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
    networks:
      authentik:
      traefik_proxy:
        aliases:
          - auth.krg.ucsd.edu
          - monitoring.krg.ucsd.edu
          - roster.krg.ucsd.edu
          - vaultwarden.krg.ucsd.edu
          - mlflow.krg.ucsd.edu
          # Aliases for the temporarily-disabled stacks — re-enable alongside their
          # compose includes above:
          # - docs.krg.ucsd.edu
          # - github.roster.krg.ucsd.edu
          # s3 (s3.krg.ucsd.edu) is served by the fabricant hypervisor's storage
          # pool, not krg-prod's Traefik — see docs/fleet-inventory.md.
          # fishsense/smartfin APIs (api.fishsense / api.smartfin) move to e4e-prod.

