# Fleet — device management / MDM for lab-owned endpoints (ADR 0012).
# Lab-owned control plane: FDE key escrow, remote lock/wipe, OS/app updates,
# and config profiles for the MDM-capable platforms (macOS/Windows/iOS/Android).
# NixOS devices are NOT managed here — the flake owns them (ADR 0012).
#
# Served at mdm.e4e.ucsd.edu (CNAME → krg-prod). Provisioned under the e4e
# namespace because E4E owns the first devices; the stack itself is lab-wide on
# krg-prod (alongside Authentik/Grafana). May be renamed (e.g. mdm.krg.ucsd.edu)
# later — the Traefik router rule below is the single anchor for that rename.
#
# Secrets: GENERATED by terraform/secrets (fleet.tf) → OpenBao → rendered to /run by
# krg.vaultAgent (db.env for MySQL, server.env for Fleet). No .secrets/ file; the stack
# fails closed if OpenBao is unreachable, like the rest of the project. Non-secret
# config (DB/Redis addresses, names) stays in ./fleet/fleet.env (committed).
services:
  fleet_mysql:
    image: mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
    env_file:
      - ./fleet/fleet.env
      - /run/krg/fleet/db.env
    # No `command:` override. `--default-authentication-plugin` was deprecated in
    # MySQL 8.0 and REMOVED in 8.4 — passing it makes mysqld abort on every start
    # ("unknown variable 'default-authentication-plugin'"), before it can finish
    # creating its system tables (which then half-inits the datadir). caching_sha2_password
    # is already the default auth plugin in 8.x, so the flag was redundant anyway; the
    # 8.4 spelling would be --authentication-policy, but the default needs nothing.
    volumes:
      - ./fleet/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 20s
      retries: 5
      # This ping AUTHENTICATES as root, so unlike the auth-less `pg_isready` checks
      # elsewhere in the stack it can't pass until mysql's first-init has fully run and
      # set the root password. On a fresh datadir, competing with ~20 other containers
      # starting at once, that init outlasts the retry budget — without a start_period
      # the container flips to `unhealthy` and compose aborts every dependent with
      # "dependency failed to start". start_period suppresses unhealthy during init.
      start_period: 120s
    networks:
      - fleet

  # Valkey, not Redis: Fleet documents Valkey as its recommended Redis-compatible
  # cache, and it's the community/LF fork (Redis went SSPL) — same FOSS lean as the
  # repo's OpenTofu/Garage choices. Wire-compatible, so FLEET_REDIS_ADDRESS is unchanged.
  fleet_valkey:
    image: valkey/valkey:9.2@sha256:247b5e730bdc9dc29fddb8274d1731b203a1a1a46af63eae3a9d55b4bf74853f
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 3
    networks:
      - fleet

  # One-shot DB migration. Fleet refuses to `serve` against an unmigrated schema;
  # `fleet prepare db` is idempotent, so it's safe to run on every `up`. The server
  # waits on this completing successfully (depends_on condition below).
  fleet_migrate:
    image: fleetdm/fleet:v4.93.2@sha256:7c076ea2139feeee1fe25e70fc7cf377291bbc1b0ce210b0350e69c4deae23ae # latest stable (2026-07; check github.com/fleetdm/fleet/releases at bring-up)
    command: ["fleet", "prepare", "db", "--no-prompt"]
    env_file:
      - ./fleet/fleet.env
      - /run/krg/fleet/server.env
    depends_on:
      fleet_mysql:
        condition: service_healthy
    restart: "no"
    networks:
      - fleet

  fleet:
    image: fleetdm/fleet:v4.93.2@sha256:7c076ea2139feeee1fe25e70fc7cf377291bbc1b0ce210b0350e69c4deae23ae # keep in lockstep with fleet_migrate above
    command: ["fleet", "serve"]
    env_file:
      - ./fleet/fleet.env
      - /run/krg/fleet/server.env
    depends_on:
      fleet_mysql:
        condition: service_healthy
      fleet_valkey:
        condition: service_started
      fleet_migrate:
        condition: service_completed_successfully
    # /healthz (plain HTTP, FLEET_SERVER_TLS=false) + the drain clause compose-reload
    # uses during a graceful handoff. Fleet servers run fine side by side.
    healthcheck:
      test: ["CMD-SHELL", "test ! -f /tmp/krg-drain && wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    labels:
      - "krg.rollout=handoff"
      - "traefik.enable=true"
      - "traefik.http.routers.fleet.rule=Host(`mdm.e4e.ucsd.edu`)"
      - "traefik.http.routers.fleet.entrypoints=websecure"
      - "traefik.http.routers.fleet.tls.certresolver=letsencrypt"
      # Fleet serves plain HTTP on :8080 (FLEET_SERVER_TLS=false); Traefik terminates
      # TLS. Pin the upstream port explicitly — the image exposes more than one.
      - "traefik.http.services.fleet.loadbalancer.server.port=8080"
    networks:
      - fleet
      - traefik_proxy

networks:
  fleet:
  traefik_proxy:
    external: true
