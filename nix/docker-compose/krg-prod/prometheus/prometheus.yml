global:
  scrape_interval: 15s
  external_labels:
    monitor: 'codelab-monitor'

scrape_configs:
  - job_name: 'node_exporter'
    scrape_interval: 5s
    static_configs:
      - targets:
          - waiter.ucsd.edu:9100
          - kastner-ml.ucsd.edu:9100
          - fabricant.ucsd.edu:9100
          # node_exporter is on every NixOS host via profiles/base.nix, and each
          # host opens :9100 to this monitoring host in-guest (issue #234,
          # krg.firewall.monitoringPorts wired from node-exporter.nix).
          - e4e-prod.ucsd.edu:9100
          - krg-ldap.ucsd.edu:9100
          - krg-vault.ucsd.edu:9100
          - krg-nat.ucsd.edu:9100 # Incus platform host (hypervisor tier)
      # krg-prod runs Prometheus itself, in a container. Its host node_exporter is
      # on the HOST's 0.0.0.0:9100 — unreachable as `localhost` (that's the
      # container's own namespace → connection refused) and unreachable via the
      # external IP (hairpins through Docker SNAT → dropped). Scrape the host via
      # host.docker.internal (the bridge gateway; mapped in compose.grafana.yml) and
      # relabel the instance back to the FQDN so it shows as one fleet host.
      # krg-prod's in-guest firewall opens 9100 to the docker bridge subnet for this.
      - targets:
          - host.docker.internal:9100
    relabel_configs:
      - source_labels: [__address__]
        regex: host\.docker\.internal:9100
        target_label: instance
        replacement: krg-prod.ucsd.edu:9100

  - job_name: 'dcgm_exporter'
    scrape_interval: 15s
    static_configs:
      - targets:
          - waiter.ucsd.edu:9400
          - kastner-ml.ucsd.edu:9400

  - job_name: 'docker_exporter'
    scrape_interval: 15s
    static_configs:
      - targets:
          - waiter.ucsd.edu:9323
          - kastner-ml.ucsd.edu:9323

  # Hypervisor-side per-VM metrics (pve_*) from prometheus-pve-exporter on the
  # Proxmox host (ansible pve_exporter role, issue #235). The exporter runs on
  # fabricant:9221 and queries the PVE API; Prometheus passes the PVE host to query
  # as ?target=, so __param_target is the PVE host and __address__ is the exporter.
  - job_name: 'pve'
    scrape_interval: 30s
    metrics_path: /pve
    static_configs:
      - targets:
          - fabricant.ucsd.edu   # the PVE host whose API to scrape
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: fabricant.ucsd.edu:9221   # the exporter's address

  # Removed: the ansible_deploy_monitor job (port 9000). That exporter belonged to
  # the old Ansible deploy host; under NixOS it's replaced by system.autoUpgrade, so
  # every target returned connection-refused. See docs/monitoring.md.

  # Prometheus self-scrape — unlocks prometheus_* metrics (TSDB head series, scrape
  # backlog, rule eval) used by the Monitoring Health dashboard.
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: ipmi_exporter
    scrape_interval: 15s
    static_configs:
      - targets:
          # localhost = krg-prod (a VM, no BMC) — kept for parity but expected down.
          - localhost:9290
          - waiter.ucsd.edu:9290
          # fabricant runs ipmi_exporter via the ansible monitoring role but was
          # never scraped — it's the hypervisor, so its BMC sensors matter most.
          - fabricant.ucsd.edu:9290

  - job_name: 'blackbox_exporter'
    static_configs:
      - targets:
          - blackbox_exporter:9115

  - job_name: website_monitoring
    scrape_interval: 1m
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://e4e.ucsd.edu/
          - https://kastner.ucsd.edu/
          - https://e4e-nas.ucsd.edu:6021/
          - https://vaultwarden.krg.ucsd.edu/
          - https://etap.nsf.gov/award/2378/opportunity/10235
          - https://fishsense.e4e.ucsd.edu/
          - https://analytics.fishsense.e4e.ucsd.edu/login/
          - https://api.fishsense.e4e.ucsd.edu
          - https://api.fishsense.e4e.ucsd.edu/api/v1/data/ping
          - https://workflows.krg.ucsd.edu/login
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115

  - job_name: blackbox-ping
    scrape_interval: 1m
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets:
          - '1.1.1.1'
          - '8.8.8.8'
          - waiter.ucsd.edu
          - kastner-ml.ucsd.edu
          - fabricant.ucsd.edu
          - krg-prod.ucsd.edu
          - e4e-octopi.dynamic.ucsd.edu
          - e4e-gateway.ucsd.edu
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115

  - job_name: 'octoprint'
    scrape_interval: 5s
    metrics_path: '/plugin/prometheus_exporter/metrics'
    static_configs:
      - targets:
          - 'e4e-octopi.dynamic.ucsd.edu:80'

  - job_name: 'traefik'
    scrape_interval: 15s
    static_configs:
      # Scraped over the traefik_proxy docker network (Prometheus joined it in
      # compose.grafana.yml). Traefik serves Prometheus metrics on its dedicated,
      # unpublished 'metrics' entrypoint :8082 — NOT the host's external interface.
      - targets:
          - traefik:8082

  - job_name: 'temporal'
    scrape_interval: 15s
    static_configs:
      - targets:
          - temporal:8000

  # Loki self-metrics (loki_* — ingestion rate, request latency, chunk flushes).
  # Reached over the krg-prod project's default network. Distinct from log CONTENT,
  # which is queried via the Loki datasource (terraform/grafana/datasources.tf).
  - job_name: 'loki'
    scrape_interval: 15s
    static_configs:
      - targets:
          - loki:3100

  # Grafana self-metrics (grafana_* + go_*). Reached over the default network.
  - job_name: 'grafana'
    scrape_interval: 15s
    static_configs:
      - targets:
          - grafana:3000

  # Authentik server + worker expose Prometheus metrics on :9300 (authentik_*).
  # They join prometheus_network in compose.authentik.yml so these are reachable.
  - job_name: 'authentik'
    scrape_interval: 15s
    static_configs:
      - targets:
          - authentik_server:9300
          - authentik_worker:9300

  # Incus daemon on krg-nat (incus_*): the HYPERVISOR's view of every tenant instance —
  # per-instance + per-project CPU/memory/disk/network/filesystem, plus daemon health —
  # WITHOUT reaching into the NAT'd guests. Enabled by krg.incus.metrics on krg-nat
  # (modules/incus.nix): a dedicated /1.0/metrics listener on :8444, opened only to this
  # monitoring host and served UNAUTHENTICATED (the firewall is the boundary, same as
  # node_exporter). HTTPS with a self-signed Incus server cert → insecure_skip_verify
  # (identity is pinned by the firewall source, not the cert). Powers KRG · Incus
  # (terraform/grafana/dashboards/incus.json).
  - job_name: 'incus'
    scrape_interval: 15s
    metrics_path: /1.0/metrics
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets:
          - krg-nat.ucsd.edu:8444
