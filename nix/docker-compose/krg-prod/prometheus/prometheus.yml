global:
  scrape_interval: 15s
  external_labels:
    monitor: 'codelab-monitor'

scrape_configs:
  - job_name: 'node_exporter'
    scrape_interval: 5s
    static_configs:
      - targets:
          - waiter.ucsd.edu:9100
          - kastner-ml.ucsd.edu:9100
          - fabricant.ucsd.edu:9100
          - krg-prod.ucsd.edu:9100
          # node_exporter is on every NixOS host via profiles/base.nix, but these
          # were never scraped. Added so the Node Fleet dashboard covers the fleet.
          - e4e-prod.ucsd.edu:9100
          - krg-ldap.ucsd.edu:9100
          - krg-vault.ucsd.edu:9100

  - job_name: 'dcgm_exporter'
    scrape_interval: 15s
    static_configs:
      - targets:
          - waiter.ucsd.edu:9400
          - kastner-ml.ucsd.edu:9400

  - job_name: 'docker_exporter'
    scrape_interval: 15s
    static_configs:
      - targets:
          - waiter.ucsd.edu:9323
          - kastner-ml.ucsd.edu:9323

  # Removed: the ansible_deploy_monitor job (port 9000). That exporter belonged to
  # the old Ansible deploy host; under NixOS it's replaced by system.autoUpgrade, so
  # every target returned connection-refused. See docs/monitoring.md.

  # Prometheus self-scrape — unlocks prometheus_* metrics (TSDB head series, scrape
  # backlog, rule eval) used by the Monitoring Health dashboard.
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: ipmi_exporter
    scrape_interval: 15s
    static_configs:
      - targets:
          # localhost = krg-prod (a VM, no BMC) — kept for parity but expected down.
          - localhost:9290
          - waiter.ucsd.edu:9290
          # fabricant runs ipmi_exporter via the ansible monitoring role but was
          # never scraped — it's the hypervisor, so its BMC sensors matter most.
          - fabricant.ucsd.edu:9290

  - job_name: 'blackbox_exporter'
    static_configs:
      - targets:
          - blackbox_exporter:9115

  - job_name: website_monitoring
    scrape_interval: 1m
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://e4e.ucsd.edu/
          - https://kastner.ucsd.edu/
          - https://e4e-nas.ucsd.edu:6021/
          - https://vaultwarden.krg.ucsd.edu/
          - https://etap.nsf.gov/award/2378/opportunity/10235
          - https://fishsense.e4e.ucsd.edu/
          - https://analytics.fishsense.e4e.ucsd.edu/login/
          - https://api.fishsense.e4e.ucsd.edu
          - https://api.fishsense.e4e.ucsd.edu/api/v1/data/ping
          - https://workflows.krg.ucsd.edu/login
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115

  - job_name: blackbox-ping
    scrape_interval: 1m
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets:
          - '1.1.1.1'
          - '8.8.8.8'
          - waiter.ucsd.edu
          - kastner-ml.ucsd.edu
          - fabricant.ucsd.edu
          - krg-prod.ucsd.edu
          - e4e-octopi.dynamic.ucsd.edu
          - e4e-gateway.ucsd.edu
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115

  - job_name: 'octoprint'
    scrape_interval: 5s
    metrics_path: '/plugin/prometheus_exporter/metrics'
    static_configs:
      - targets:
          - 'e4e-octopi.dynamic.ucsd.edu:80'

  - job_name: 'traefik'
    scrape_interval: 15s
    static_configs:
      # Scraped over the traefik_proxy docker network (Prometheus joined it in
      # compose.grafana.yml). Traefik serves Prometheus metrics on its dedicated,
      # unpublished 'metrics' entrypoint :8082 — NOT the host's external interface.
      - targets:
          - traefik:8082

  - job_name: 'temporal'
    scrape_interval: 15s
    static_configs:
      - targets:
          - fishsense-temporal:8000
