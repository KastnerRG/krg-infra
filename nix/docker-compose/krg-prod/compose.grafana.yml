services:
  grafana:
    image: grafana/grafana-enterprise:13.0
    container_name: grafana
    user: '1000'
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=e4eadmin
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_e4eadmin_password
    secrets:
      - grafana_e4eadmin_password
    volumes:
      - ./grafana-storage:/var/lib/grafana:rw
      - ./grafana:/etc/grafana:ro
    networks:
      - traefik_proxy
      - default
    labels:
      - "traefik.enable=true"
      # Lab-wide Grafana — the canonical monitoring entrypoint for the fleet.
      - "traefik.http.routers.grafana.rule=Host(`monitoring.krg.ucsd.edu`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  loki:
    image: grafana/loki:3.7
    user: '1000'
    ports:
      - 3100:3100
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - ./loki/loki-data:/loki:rw
    restart: unless-stopped
    networks:
      - default
      - loki_network

  # Grafana Alloy — log shipper, replaces Promtail (EOL 2026-03-02). Config in
  # loki/config.alloy. --storage.path holds the read offsets (replaces the old
  # promtail positions file). Runs as root so it can read the systemd journal +
  # root-owned files under /var/log; data dir is the only writable mount.
  alloy:
    image: grafana/alloy:v1.17.0
    volumes:
      - /var/log:/var/log:ro
      - /etc/machine-id:/etc/machine-id:ro
      - ./loki/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    restart: unless-stopped
    networks:
      - loki_network

  prometheus:
    image: prom/prometheus:v3.12.0
    # NOTE: deliberately NO `user:` line. The prom/prometheus image already runs as
    # its built-in `nobody` (uid 65534), and the ./prometheus-data bind mount is
    # owned 65534 to match (see nix/hosts/krg-prod/default.nix tmpfiles). Pinning
    # `user: '1000'` here (as grafana/loki do) would make nobody-owned TSDB blocks
    # unwritable → "permission denied" panic → crash loop. Leave it on the default.
    container_name: prometheus
    command: >
      --config.file=/etc/prometheus/prometheus.yml
      --storage.tsdb.retention.time=2y
      --storage.tsdb.retention.size=700GB
      --storage.tsdb.wal-compression
    restart: unless-stopped
    networks:
      - prometheus_network
      - default
      # Join the Traefik network so Prometheus can scrape Traefik's metrics
      # entrypoint (traefik:8082) without publishing it to the host. traefik_proxy
      # is declared external in compose.yml (the project root).
      - traefik_proxy
    volumes:
      # Mount the config by its Nix store path (PROM_CONFIG_DIR, set in the
      # krg-prod compose-stack service environment by nix/hosts/krg-prod/default.nix)
      # rather than the ./prometheus working-dir symlink. The store path changes
      # whenever prometheus/ changes, so `docker compose up -d` sees a different
      # volume and recreates Prometheus on deploy — otherwise the running container
      # keeps the config it bind-mounted at create time and scrape edits never go
      # live (Prometheus has no --web.enable-lifecycle and isn't force-recreated).
      - ${PROM_CONFIG_DIR}:/etc/prometheus:ro
      - ./prometheus-data:/prometheus:rw

  blackbox_exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.28.0
    container_name: blackbox_exporter
    volumes:
      - ./blackbox-exporter:/config:ro
    command: --config.file=/config/blackbox.yml
    ports:
      - 9115:9115
    dns: 8.8.8.8
    restart: unless-stopped

secrets:
  grafana_e4eadmin_password:
    # Rendered from OpenBao (secret/krg-prod/grafana-admin, field `password`) by
    # krg.vaultAgent — see nix/hosts/krg-prod/default.nix.
    file: /run/krg/krg-prod/grafana-admin-password

networks:
  loki_network:
  prometheus_network:
    external: true

volumes:
  alloy_data:
