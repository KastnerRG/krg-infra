services:
  grafana:
    image: grafana/grafana-enterprise:12.3
    container_name: grafana
    user: '1000'
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=e4eadmin
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_e4eadmin_password
    secrets:
      - grafana_e4eadmin_password
    volumes:
      - ./grafana-storage:/var/lib/grafana:rw
      - ./grafana:/etc/grafana:ro
    networks:
      - traefik_proxy
      - default
    labels:
      - "traefik.enable=true"
      # Lab-wide Grafana — the canonical monitoring entrypoint for the fleet.
      - "traefik.http.routers.grafana.rule=Host(`monitoring.krg.ucsd.edu`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  loki:
    image: grafana/loki:3.6
    user: '1000'
    ports:
      - 3100:3100
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - ./loki/loki-data:/loki:rw
    restart: unless-stopped
    networks:
      - default
      - loki_network

  promtail:
    image: grafana/promtail:3.6
    user: '1000'
    volumes:
      - /var/log:/var/log:ro
      # Dropped: ./ansible.log mount (leftover from the Ansible-deployed host; the
      # source doesn't exist under NixOS, so Docker would materialise it as a
      # root-owned dir). promtail-config.yaml should target the journal / /var/log.
      - ./loki/promtail-config.yaml:/etc/promtail/config.yml:ro
      - promtail_positions:/var/lib/promtail
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    networks:
      - loki_network

  prometheus:
    image: prom/prometheus:v3.8.1
    container_name: prometheus
    command: >
      --config.file=/etc/prometheus/prometheus.yml
      --storage.tsdb.retention.time=2y
      --storage.tsdb.retention.size=700GB
      --storage.tsdb.wal-compression
    restart: unless-stopped
    networks:
      - prometheus_network
      - default
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - ./prometheus-data:/prometheus:rw

  blackbox_exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.28.0
    container_name: blackbox_exporter
    volumes:
      - ./blackbox-exporter:/config:ro
    command: --config.file=/config/blackbox.yml
    ports:
      - 9115:9115
    dns: 8.8.8.8
    restart: unless-stopped

secrets:
  grafana_e4eadmin_password:
    file: .secrets/gf_admin_password.txt

networks:
  loki_network:
  prometheus_network:
    external: true

volumes:
  promtail_positions:
