# Temporal — lab-wide workflow engine at workflows.krg.ucsd.edu. Include'd into the
# krg-prod compose project (compose.yml). It started life as a standalone stack to
# "scope" its OpenBao dependency, but that isolation was illusory (every bao-backed
# service shares the single openbao-agent oneshot's fate), so it rides the one
# krg-prod project + bao dependency alongside authentik/grafana/vaultwarden/guacamole.
#
# Three containers:
#   temporal-postgres  — dedicated persistence (docker-managed named volume)
#   temporal           — the Temporal server (auto-setup creates/upgrades schema)
#   temporal-ui        — the Web UI, gated by Authentik OIDC (login federation)
#
# Auth is the UI's native OIDC client (like grafana/vaultwarden) — Traefik
# terminates TLS, then temporal-ui itself bounces unauthenticated users through
# Authentik. No proxy outpost needed.
#
# Secrets: rendered by the OpenBao Agent (tmpfs, fail-closed — see krg.vaultAgent),
# NEVER a .secrets/ file. Split one var per file so no image sees a var it doesn't
# own (the guacamole legacy-prefix lesson):
#   db.env     → POSTGRES_PASSWORD            (postgres, from secret/krg-prod/temporal)
#   server.env → POSTGRES_PWD                 (server, same value, Temporal's var name)
#   ui.env     → TEMPORAL_AUTH_CLIENT_SECRET  (ui, from secret/krg-prod/temporal-oidc)
services:
  temporal-postgres:
    image: postgres:16.11
    container_name: temporal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      # POSTGRES_PASSWORD provided by db.env (rendered by the OpenBao Agent).
    env_file:
      - /run/krg/temporal/db.env
    volumes:
      # Docker-managed named volume — postgres:16 runs as its own uid, so a named
      # volume avoids the host-uid juggling a bind mount would need (same choice as
      # the guacamole stack).
      - temporal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "temporal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [temporal_internal]

  temporal:
    image: temporalio/auto-setup:1.29.7
    container_name: temporal
    restart: unless-stopped
    environment:
      # postgres12 is the generic PostgreSQL plugin (works for PG 12+, incl. 16).
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_SEEDS=temporal-postgres
      # Expose the server's Prometheus metrics so prometheus can scrape
      # temporal:8000 over prometheus_network (see the krg-prod prometheus.yml).
      - PROMETHEUS_ENDPOINT=0.0.0.0:8000
    env_file:
      - /run/krg/temporal/server.env # POSTGRES_PWD
    depends_on:
      temporal-postgres:
        condition: service_healthy
    networks:
      - temporal_internal
      - prometheus_network

  temporal-ui:
    image: temporalio/ui:2.51.0
    container_name: temporal-ui
    restart: unless-stopped
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=https://workflows.krg.ucsd.edu
      # ── Authentik OIDC SSO ────────────────────────────────────────────────────
      # PROVIDER_URL is the Authentik application issuer (slug "temporal", trailing
      # slash); temporal-ui (go-oidc) appends /.well-known/openid-configuration and
      # verifies the ID token against jwks_uri — which is why the provider carries
      # an RS256 signing_key in terraform/authentik/applications_krg.tf (HS256 +
      # empty JWKS → "Invalid ID token", the failure guacamole/vaultwarden hit).
      - TEMPORAL_AUTH_ENABLED=true
      - TEMPORAL_AUTH_TYPE=oidc
      - TEMPORAL_AUTH_PROVIDER_URL=https://auth.krg.ucsd.edu/application/o/temporal/
      - TEMPORAL_AUTH_CLIENT_ID=temporal
      - TEMPORAL_AUTH_CALLBACK_URL=https://workflows.krg.ucsd.edu/auth/sso/callback
      - TEMPORAL_AUTH_SCOPES=openid,profile,email
    env_file:
      - /run/krg/temporal/ui.env # TEMPORAL_AUTH_CLIENT_SECRET
    depends_on:
      - temporal
    networks:
      - temporal_internal
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.temporal.rule=Host(`workflows.krg.ucsd.edu`)"
      - "traefik.http.routers.temporal.entrypoints=websecure"
      - "traefik.http.routers.temporal.tls.certresolver=letsencrypt"
      - "traefik.http.services.temporal.loadbalancer.server.port=8080"

volumes:
  temporal_pgdata:

networks:
  temporal_internal: {}
  traefik_proxy:
    external: true
  prometheus_network:
    external: true
