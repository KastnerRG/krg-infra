# Temporal — lab-wide workflow engine at workflows.krg.ucsd.edu. Include'd into the
# krg-prod compose project (compose.yml). It started life as a standalone stack to
# "scope" its OpenBao dependency, but that isolation was illusory (every bao-backed
# service shares the single openbao-agent oneshot's fate), so it rides the one
# krg-prod project + bao dependency alongside authentik/grafana/vaultwarden/guacamole.
#
# Four containers:
#   temporal-postgres  — dedicated persistence (docker-managed named volume)
#   temporal-schema    — one-shot: creates/upgrades the schema, then exits
#   temporal           — the Temporal server (temporalio/server), started only after
#                        temporal-schema exits 0
#   temporal-ui        — the Web UI, gated by Authentik OIDC (login federation)
#
# temporalio/auto-setup (server + schema setup + default-namespace create in one
# image) was discontinued at 1.29.7. This is its replacement, Temporal's own
# samples-server/compose shape: admin-tools runs the schema steps auto-setup ran on
# every boot, the plain server image runs the server. Namespaces are terraform/temporal's
# (the `default` namespace + its Custom*Field search attributes auto-setup created
# already live in the DB; nothing creates them on a FRESH database any more).
#
# UPGRADING: one MINOR version at a time (1.29 → 1.30 → 1.31 → …), the latest patch of
# each, with the server actually running on every hop. Temporal only guarantees
# compatibility between successive minors; skipping one can leave data unreadable.
# temporal-schema and temporal stay in LOCKSTEP (same version): the schema dir in
# admin-tools is what the matching server expects.
#
# Auth is the UI's native OIDC client (like grafana/vaultwarden) — Traefik
# terminates TLS, then temporal-ui itself bounces unauthenticated users through
# Authentik. No proxy outpost needed.
#
# Secrets: rendered by the OpenBao Agent (tmpfs, fail-closed — see krg.vaultAgent),
# NEVER a .secrets/ file. Split one var per file so no image sees a var it doesn't
# own (the guacamole legacy-prefix lesson):
#   db.env     → POSTGRES_PASSWORD            (postgres, from secret/krg-prod/authentik-managed/temporal)
#   server.env → POSTGRES_PWD                 (server, same value, Temporal's var name)
#   ui.env     → TEMPORAL_AUTH_CLIENT_SECRET  (ui, from secret/krg-prod/authentik-managed/temporal-oidc)
#
# Frontend mTLS material is ALSO vault-agent-rendered, to /run/krg/temporal/tls/
# (issued by the lab-internal CA in terraform/openbao/pki.tf), mounted read-only
# at /etc/temporal/tls in the server + UI:
#   frontend.pem  → frontend SERVER cert+key (temporal-frontend role)
#   ca.crt        → intermediate CA (frontend client-CA + UI server-CA)
#   ui-client.pem → temporal-ui CLIENT cert+key (temporal-client role)
# Design + on-box validation gates: docs/temporal-mtls.md (UNVALIDATED).
services:
  temporal-postgres:
    image: postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    container_name: temporal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      # POSTGRES_PASSWORD provided by db.env (rendered by the OpenBao Agent).
    env_file:
      - /run/krg/temporal/db.env
    volumes:
      # Docker-managed named volume — postgres:16 runs as its own uid, so a named
      # volume avoids the host-uid juggling a bind mount would need (same choice as
      # the guacamole stack).
      - temporal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "temporal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [temporal_internal]

  # The schema steps temporalio/auto-setup ran on every boot (its setup_postgres_schema),
  # verbatim: idempotent — on a database already at the target version they log
  # "found zero updates" and exit 0. `temporal` itself is created by the postgres
  # container (POSTGRES_USER), so only the visibility database is created here.
  # update-schema is the step that migrates on a version bump; if it fails, this
  # exits non-zero and the server is never started against a half-migrated schema.
  temporal-schema:
    # 1.29 admin-tools tags carry the CLI versions; from 1.30 they're plain (1.30.8).
    image: temporalio/admin-tools:1.29.7-tctl-1.18.4-cli-1.7.2@sha256:4a17b5be706c56a9238fb7b5b32a36966cee14939658b20597837b2443b277c8
    restart: "no"
    env_file:
      - /run/krg/temporal/server.env # POSTGRES_PWD
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        export SQL_PASSWORD="$$POSTGRES_PWD"
        sql() { temporal-sql-tool --plugin postgres12 --ep temporal-postgres -p 5432 -u temporal "$$@"; }
        dir=/etc/temporal/schema/postgresql/v12
        sql --db temporal setup-schema -v 0.0
        sql --db temporal update-schema -d "$$dir/temporal/versioned"
        sql --db temporal_visibility create
        sql --db temporal_visibility setup-schema -v 0.0
        sql --db temporal_visibility update-schema -d "$$dir/visibility/versioned"
    depends_on:
      temporal-postgres:
        condition: service_healthy
    networks: [temporal_internal]

  temporal:
    # Pin to a tag that EXISTS on Docker Hub (#465 pinned a nonexistent one and
    # crash-looped into the pull limit). Keep in lockstep with temporal-schema above.
    image: temporalio/server:1.29.7@sha256:688da708d0daca6ff8083334a4a7fbbdbc7e70d1cca8e2eda8c05b21fdbd601e
    container_name: temporal
    restart: unless-stopped
    environment:
      # postgres12 is the generic PostgreSQL plugin (works for PG 12+, incl. 16).
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_SEEDS=temporal-postgres
      # Expose the server's Prometheus metrics so prometheus can scrape
      # temporal:8000 over prometheus_network (see the krg-prod prometheus.yml).
      - PROMETHEUS_ENDPOINT=0.0.0.0:8000
      # ── Frontend mTLS ─────────────────────────────────────────────────────────
      # Lab-internal CA (terraform/openbao/pki.tf); certs rendered by vault-agent
      # to /run/krg/temporal/tls (mounted below). UNVALIDATED — see the bring-up +
      # validation gates in docs/temporal-mtls.md before trusting this.
      #
      # requireClientAuth is SHARED with internode TLS, and the internal system
      # worker talks to the frontend — so enabling it naively wedges first boot.
      # Fixed with the internal-frontend: internal traffic uses plaintext :7236,
      # leaving the PUBLIC :7233 free to require client certs.
      - USE_INTERNAL_FRONTEND=true # render the internal-frontend config block (:7236)
      # USE_INTERNAL_FRONTEND only renders the *config*; the server still has to be
      # ASKED to run the role — without it internal-frontend is configured but "not
      # requested" and :7236 never listens. The server starts only the default 4
      # roles unless told otherwise, and HOW changed at 1.30: the 1.29 image's
      # start-temporal.sh reads SERVICES (colon list); 1.30+ dropped that script and
      # temporal-server reads TEMPORAL_SERVICES (comma list) itself. Both are set so
      # the 1.30 bump is a pure tag change; drop SERVICES once past 1.29.
      - SERVICES=frontend:internal-frontend:history:matching:worker
      - TEMPORAL_SERVICES=frontend,internal-frontend,history,matching,worker
      - BIND_ON_IP=0.0.0.0 # frontend must bind all ifaces so temporal-ui reaches :7233 cross-container (the image default 127.0.0.1 is container-local)
      - TEMPORAL_TLS_REQUIRE_CLIENT_AUTH=true
      - TEMPORAL_TLS_FRONTEND_CERT=/etc/temporal/tls/frontend.pem
      - TEMPORAL_TLS_FRONTEND_KEY=/etc/temporal/tls/frontend.pem # combined cert+key PEM (atomic pair)
      - TEMPORAL_TLS_CLIENT1_CA_CERT=/etc/temporal/tls/ca.crt # CA that signs accepted client certs
      - TEMPORAL_TLS_FRONTEND_SERVER_NAME=temporal
    env_file:
      - /run/krg/temporal/server.env # POSTGRES_PWD
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    volumes:
      # mTLS material rendered by vault-agent (read-only). uid 1000 reads it; the
      # /run/krg/temporal/tls dir is 0750 root on the host, so it's gated there.
      - /run/krg/temporal/tls:/etc/temporal/tls:ro
      # The dynamic config file the server polls (DYNAMIC_CONFIG_FILE_PATH default).
      # The 1.29 image shipped an empty one; from 1.30 the image ships none, and a
      # missing file is FATAL ("unable to create dynamic config client"). Committed,
      # symlinked into the working dir by default.nix.
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    ports:
      # PUBLIC gRPC frontend — external workers (NRP) + the terraform/temporal
      # provider connect here. Explicit 0.0.0.0 (overriding krg.docker.defaultPublishAddress's
      # loopback default) is the deliberate opt-in to expose it; safe ONLY because the
      # frontend requires a client cert (TEMPORAL_TLS_REQUIRE_CLIENT_AUTH) — reachability
      # is not the control, the mTLS cert is. The proxmox perimeter opens :7233 too
      # (ansible krg-prod.fw). The UI/HTTP stays behind Traefik; this is gRPC only.
      - "0.0.0.0:7233:7233"
    networks:
      - temporal_internal
      - prometheus_network

  temporal-ui:
    image: temporalio/ui:2.57.0@sha256:d944f959d0923c35cd991a17a0edbe087770eff843724b181933e0cfdd563ab2
    # No container_name: updates are graceful handoffs (krg.rollout below). The
    # vault-agent TLS hook restarts it by compose service label, not by name.
    restart: unless-stopped
    # /healthz answers {"status":"OK"} without needing the Temporal backend (so a
    # frontend blip doesn't fail the UI's liveness). Plus the drain clause.
    healthcheck:
      test: ["CMD-SHELL", "test ! -f /tmp/krg-drain && wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=https://workflows.krg.ucsd.edu
      # ── Frontend mTLS (client side) ─────────────────────────────────────────────
      # The frontend now requires client auth, so the UI must present a client cert
      # (temporal-client role) and verify the server against the lab-internal CA.
      # server_name MUST match the frontend cert's SAN (`temporal`). Cert+key in one
      # PEM (atomic pair, see the host render). docs/temporal-mtls.md, UNVALIDATED.
      - TEMPORAL_TLS_CA=/etc/temporal/tls/ca.crt
      - TEMPORAL_TLS_CERT=/etc/temporal/tls/ui-client.pem
      - TEMPORAL_TLS_KEY=/etc/temporal/tls/ui-client.pem
      - TEMPORAL_TLS_SERVER_NAME=temporal
      - TEMPORAL_TLS_ENABLE_HOST_VERIFICATION=true
      # ── Authentik OIDC SSO ────────────────────────────────────────────────────
      # PROVIDER_URL is the Authentik application issuer (slug "temporal", trailing
      # slash); temporal-ui (go-oidc) appends /.well-known/openid-configuration and
      # verifies the ID token against jwks_uri — which is why the provider carries
      # an RS256 signing_key in terraform/authentik/applications_krg.tf (HS256 +
      # empty JWKS → "Invalid ID token", the failure guacamole/vaultwarden hit).
      - TEMPORAL_AUTH_ENABLED=true
      - TEMPORAL_AUTH_TYPE=oidc
      - TEMPORAL_AUTH_PROVIDER_URL=https://auth.krg.ucsd.edu/application/o/temporal/
      - TEMPORAL_AUTH_CLIENT_ID=temporal
      - TEMPORAL_AUTH_CALLBACK_URL=https://workflows.krg.ucsd.edu/auth/sso/callback
      - TEMPORAL_AUTH_SCOPES=openid,profile,email
    env_file:
      - /run/krg/temporal/ui.env # TEMPORAL_AUTH_CLIENT_SECRET
    depends_on:
      - temporal
    volumes:
      # mTLS material rendered by vault-agent (read-only) — the UI's client cert + CA.
      - /run/krg/temporal/tls:/etc/temporal/tls:ro
    networks:
      - temporal_internal
      - traefik_proxy
    labels:
      - "krg.rollout=handoff"
      - "traefik.enable=true"
      - "traefik.http.routers.temporal.rule=Host(`workflows.krg.ucsd.edu`)"
      - "traefik.http.routers.temporal.entrypoints=websecure"
      - "traefik.http.routers.temporal.tls.certresolver=letsencrypt"
      - "traefik.http.services.temporal.loadbalancer.server.port=8080"

volumes:
  temporal_pgdata:

networks:
  temporal_internal: {}
  traefik_proxy:
    external: true
  prometheus_network:
    external: true
