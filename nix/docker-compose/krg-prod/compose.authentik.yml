x-authentik-image: &authentik-image ghcr.io/goauthentik/server:2026.5.3
x-authentik-proxy-image: &authentik-proxy-image ghcr.io/goauthentik/proxy:2026.5.3

services:
  postgres_authentik:
    # Major bump 16 → 18: the PG data dir is NOT forward-compatible — the 18 image
    # refuses to start on a 16.x cluster. Run the one-time dump/restore in
    # docs/postgres-16-to-18-migration.md BEFORE this generation's stack starts.
    image: postgres:18.4
    container_name: postgres_authentik
    restart: unless-stopped
    shm_size: 128 mb
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/authentik_postgres_admin_password
      # postgres:18 moved the default data layout to /var/lib/postgresql/<major>/docker
      # and refuses to use data at the legacy /var/lib/postgresql/data mount ("unused
      # mount/volume"). Pin PGDATA back to the bind-mount path to keep the pre-18 layout
      # (so the ./authentik/postgres/data bind mount is used directly). See
      # docs/postgres-16-to-18-migration.md.
      PGDATA: /var/lib/postgresql/data
    env_file:
      # Provides AUTHENTIK_POSTGRESQL__PASSWORD used by the init script
      # (2026-05-21_create_users.sh) to set the authentik role password.
      # Rendered from OpenBao by krg.vaultAgent (nix/hosts/krg-prod/default.nix).
      - /run/krg/krg-prod/authentik.env
    volumes:
      - ./authentik/postgres/data/:/var/lib/postgresql/data/:rw
      - ./authentik/postgres/config/:/etc/postgresql/:ro
      - ./authentik/postgres/scripts/:/docker-entrypoint-initdb.d/:ro
      - /etc/passwd:/etc/passwd:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    secrets:
      - authentik_postgres_admin_password
    command: --config_file=/etc/postgresql/postgres.conf
    ports:
      # Loopback only — Postgres must not be reachable off-host. Docker publishes
      # ports past the nftables INPUT rules, so a bare "5434:5432" would expose it
      # on the VM's external interface. Containers reach it by service name anyway.
      - 127.0.0.1:5434:5432
    networks:
      - authentik
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"

  authentik_server:
    image: *authentik-image
    container_name: authentik_server
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgres_authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik_db
      # Mirrors authentik_worker's email block below. The server process handles the
      # HTTP request that constructs+enqueues outgoing email (e.g. the recovery
      # stage's "forgot password" send), computing from_email from ITS OWN Django
      # settings at that point — only the worker had these vars, so the server fell
      # back to authentik's hardcoded default (authentik@localhost), which UCSD's
      # relay then rejected as not fully-qualified ("Sender address rejected").
      AUTHENTIK_EMAIL__HOST: smtp.ucsd.edu
      AUTHENTIK_EMAIL__PORT: 25
      AUTHENTIK_EMAIL__USE_TLS: false
      AUTHENTIK_EMAIL__USE_SSL: false
      AUTHENTIK_EMAIL__TIMEOUT: 60
      AUTHENTIK_EMAIL__FROM: e4e@ucsd.edu
    volumes:
      - ./authentik/media:/media
      - ./authentik/data:/data
      - ./authentik/custom-templates:/templates
      # App-tile icons, read-only from the Nix store. 2026.2 serves application
      # icons from /data/media/public/<name>; meta_icon = "krg-icons/<file>" in
      # terraform/authentik points here. See authentik/media-icons/README.md.
      - ./authentik/media-icons:/data/media/public/krg-icons:ro
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - /run/krg/krg-prod/authentik.env
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    networks:
      - authentik
      - traefik_proxy
      # Prometheus scrapes authentik_* metrics on :9300 over this network.
      - prometheus_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authentik_server.rule=Host(`auth.krg.ucsd.edu`)"
      - "traefik.http.routers.authentik_server.entrypoints=websecure"
      - "traefik.http.routers.authentik_server.tls.certresolver=letsencrypt"
      - "traefik.http.services.authentik_server.loadbalancer.server.port=9000"
    depends_on:
      postgres_authentik:
        condition: service_healthy

  authentik_worker:
    image: *authentik-image
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgres_authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik_db
      AUTHENTIK_EMAIL__HOST: smtp.ucsd.edu
      AUTHENTIK_EMAIL__PORT: 25
      AUTHENTIK_EMAIL__USE_TLS: false
      AUTHENTIK_EMAIL__USE_SSL: false
      AUTHENTIK_EMAIL__TIMEOUT: 60
      # No SMTP auth needed: smtp.ucsd.edu:25 relays for e4e@ucsd.edu unauthenticated
      # from krg-prod's IP (confirmed via manual smtplib send, 2026-06-17).
      AUTHENTIK_EMAIL__FROM: e4e@ucsd.edu
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./authentik/media:/media
      - ./authentik/data:/data
      # NOTE: the read-only krg-icons mount is intentionally NOT mounted here.
      # The worker runs as root, so its entrypoint does a recursive `chown /data`
      # before dropping privileges; a :ro mount under /data makes that chown fail
      # fatally (exit 1) and crash-loops the worker, which silently stops ALL
      # background tasks (LDAP sync, email, outposts). App-tile icons are served
      # over HTTP by authentik_server (which mounts them, but runs non-root and so
      # skips the chown) — the worker never serves media, so it doesn't need them.
      - ./authentik/certs:/certs
      - ./authentik/custom-templates:/templates
    env_file:
      - /run/krg/krg-prod/authentik.env
    networks:
      - authentik
      # Prometheus scrapes the worker's :9300 metrics over this network.
      - prometheus_network
    depends_on:
      postgres_authentik:
        condition: service_healthy

  authentik_proxy:
    image: *authentik-proxy-image
    container_name: authentik_proxy
    environment:
      TMPDIR: /data/tmp
      AUTHENTIK_POSTGRESQL__HOST: postgres_authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik_db
      AUTHENTIK_HOST: https://auth.krg.ucsd.edu
      AUTHENTIK_INSECURE: "false"
    volumes:
      - ./authentik/proxy-tmp:/data/tmp
    labels:
      traefik.enable: true
      traefik.port: 9000
      traefik.http.routers.authentik.rule: HostRegexp(`{host:[a-z-.]+}.ucsd.edu`) && PathPrefix(`/outpost.goauthentik.io/`)
      traefik.http.middlewares.authentik.forwardauth.address: http://authentik_proxy:9000/outpost.goauthentik.io/auth/traefik
      traefik.http.middlewares.authentik.forwardauth.trustForwardHeader: true
      traefik.http.middlewares.authentik.forwardauth.authResponseHeaders: X-authentik-username,X-authentik-groups,X-authentik-entitlements,X-authentik-email,X-authentik-name,X-authentik-uid,X-authentik-jwt,X-authentik-meta-jwks,X-authentik-meta-outpost,X-authentik-meta-provider,X-authentik-meta-app,X-authentik-meta-version,X-authentik-username,X-authentik-email,X-authentik-name
      traefik.http.routers.authentik.priority: 1000000
    env_file:
      - /run/krg/krg-prod/authentik.env
      - /run/krg/krg-prod/authentik-outpost-token.env
    restart: unless-stopped
    networks:
      - authentik
      - traefik_proxy

  # NOTE: the LDAP outpost container (authentik_ldap, for the Proxmox PVE LDAP realm)
  # is intentionally NOT here yet. Its AUTHENTIK_TOKEN comes from a vault-agent render
  # of a MANUAL outpost token that only exists AFTER terraform/authentik creates the
  # outpost — and that agent is fail-closed, so adding the render before the secret
  # is seeded takes the whole krg-prod stack down. The container + its token render
  # land together in a follow-up, after the token is seeded. See docs/proxmox-auth.md.

secrets:
  authentik_postgres_admin_password:
    # Rendered from OpenBao (secret/krg-prod/authentik, field
    # `postgres_admin_password`) by krg.vaultAgent — see nix/hosts/krg-prod/default.nix.
    file: /run/krg/krg-prod/authentik-postgres-admin-password

networks:
  authentik:
    external: true
  traefik_proxy:
    external: true
  prometheus_network:
    external: true
