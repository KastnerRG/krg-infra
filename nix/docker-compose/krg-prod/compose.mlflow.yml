services:
  mlflow_postgres:
    image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_DB: mlflow
      # postgres:18 changed its default data layout and rejects data at the legacy
      # /var/lib/postgresql/data mount — pin PGDATA back to the classic layout.
      PGDATA: /var/lib/postgresql/data
    # The DB password is rendered from OpenBao to /run by krg.vaultAgent (its own file,
    # so the postgres image never sees a var it doesn't own). MLflow is a fresh
    # bring-up: postgres initializes the data dir with this password on first start, so
    # it must never rotate (terraform/secrets/mlflow.tf guards that).
    env_file:
      - /run/krg/mlflow/db.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Create the separate mlflow_auth DB (mlflow-oidc-auth's user/permission store)
      # on first init — postgres only auto-creates POSTGRES_DB (mlflow).
      - ./mlflow/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mlflow_internal

  mlflow:
    build: ./mlflow/config
    # The deploy runs `up` without --build, so it builds only when this tag is new to
    # the host: bump it (= MLFLOW_VERSION, plus a -N suffix for other Dockerfile
    # changes) with every Dockerfile change, or the old image keeps running.
    image: krg-prod-mlflow:3.15.0
    restart: unless-stopped
    # Secret-bearing env (rendered by krg.vaultAgent to /run): the password-embedding
    # MLFLOW_BACKEND_STORE_URI + OIDC_USERS_DB_URI, plus SECRET_KEY and
    # OIDC_CLIENT_SECRET. The Dockerfile expands the two URIs into --backend-store-uri /
    # --artifacts-destination (MLflow reads neither from the environment).
    env_file:
      - /run/krg/mlflow/mlflow.env
    environment:
      MLFLOW_ARTIFACTS_DESTINATION: /mlflow/artifacts
      # MLflow validates the Host header and CORS origin (real env vars it reads).
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow.krg.ucsd.edu"
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: "https://mlflow.krg.ucsd.edu"
      # Non-secret OIDC config. The client_secret + SECRET_KEY come from env_file above.
      OIDC_CLIENT_ID: mlflow
      OIDC_DISCOVERY_URL: "https://auth.krg.ucsd.edu/application/o/mlflow/.well-known/openid-configuration"
      OIDC_REDIRECT_URI: "https://mlflow.krg.ucsd.edu/callback"
      # SPACE-separated (OAuth2 spec form), NOT comma: authlib does scope.split() on
      # whitespace and only generates the OIDC nonce when "openid" is a resulting list
      # element. A comma-joined string is one opaque token → no nonce → authlib never
      # parses the id_token into userinfo → the login fails with "No user information
      # received". Must include `groups` so Authentik emits the AD-group claim the
      # access gates below match.
      OIDC_SCOPE: "openid email profile groups"
      # AD-sourced Authentik groups (spec/krg-ad/groups.yml). Members of "MLflow Users"
      # get standard access; "MLflow Admins" get admin.
      OIDC_GROUP_NAME: "MLflow Users"
      OIDC_ADMIN_GROUP_NAME: "MLflow Admins"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    depends_on:
      mlflow_postgres:
        condition: service_healthy
    # Up = the server answers HTTP below 500 (python:3.12-slim has no curl/wget, so
    # stdlib). The Host header matches MLFLOW_SERVER_ALLOWED_HOSTS, which rejects other
    # hosts. Plus the drain clause compose-reload uses during a graceful handoff.
    healthcheck:
      test: ["CMD-SHELL", "test ! -f /tmp/krg-drain && python -c \"import http.client as h,sys; c=h.HTTPConnection('127.0.0.1',5000,timeout=4); c.request('GET','/health',headers={'Host':'mlflow.krg.ucsd.edu'}); sys.exit(c.getresponse().status>=500)\""]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 90s
      start_interval: 3s
    networks:
      - mlflow_internal
      - traefik_proxy
    labels:
      - "krg.rollout=handoff"
      - "traefik.enable=true"
      - "traefik.http.routers.mlflow.rule=Host(`mlflow.krg.ucsd.edu`)"
      - "traefik.http.routers.mlflow.entrypoints=websecure"
      - "traefik.http.routers.mlflow.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mlflow.middlewares=mlflow-cors-headers"
      - "traefik.http.services.mlflow.loadbalancer.server.port=5000"
      - "traefik.http.middlewares.mlflow-cors-headers.headers.accesscontrolallowmethods=GET,OPTIONS,PUT,POST,PATCH,DELETE"
      - "traefik.http.middlewares.mlflow-cors-headers.headers.accesscontrolalloworiginlist=https://mlflow.krg.ucsd.edu"
      - "traefik.http.middlewares.mlflow-cors-headers.headers.accesscontrolallowheaders=Content-Type,Authorization,X-Requested-With,X-Mlflow-Workspace,X-Mlflow-Experiment-Id"
      - "traefik.http.middlewares.mlflow-cors-headers.headers.accesscontrolallowcredentials=true"
      - "traefik.http.middlewares.mlflow-cors-headers.headers.accesscontrolmaxage=3600"
      - "traefik.http.middlewares.mlflow-cors-headers.headers.addvaryheader=true"

volumes:
  postgres_data:
  mlflow_artifacts:

networks:
  mlflow_internal:
  traefik_proxy:
    external: true
