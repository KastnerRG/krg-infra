# Requires the integrated roster revision (backend + db) and Compose >= 2.30.
# Runtime secrets override nonsecret checkout settings without $/quote expansion.
services:
  backend:
    environment:
      LDAP_CHANGE_SIGNAL_PATH: /run/ldap-change/pending
    volumes:
      - type: bind
        source: /run/krg/authentik-ldap-sync/requests
        target: /run/ldap-change
        bind:
          create_host_path: false
    env_file: !override
      - .env
      - path: /run/krg/roster/backend.env
        format: raw
