# KRG.LOCAL Active Directory — domain password policy (declarative source of truth).
#
# Applied with `samba-tool domain passwordsettings set`. The apply manages ONLY
# the keys present below (each maps to one flag); it reads the live policy
# (`samba-tool domain passwordsettings show`), diffs, and only writes on drift.
#
# ── Decisions encoded here ──────────────────────────────────────────────────
#
# 1. PASSWORDS DO NOT EXPIRE  (max_pwd_age: 0).
#    Mandatory periodic rotation is deprecated guidance — it pushes users toward
#    weaker, predictably-incremented passwords and does not measurably reduce
#    compromise (NIST SP 800-63B §5.1.1.2: do not require periodic change; rotate
#    only on evidence of compromise). The live policy was max age 42 days; this
#    sets it to 0 (never). Service accounts (authentik-bind, svc_roster) benefit
#    most — a silently-expired bind account breaks SSO/roster.
#
# 2. UCSD AD PASSWORD STANDARD  (min_pwd_length: 12, complexity: on).
#    UCSD's AD standard (blink.ucsd.edu/technology/network/access/secure-passwords.html):
#    "At least 12 characters", "characters from at least 3 of 4 categories
#    (uppercase, lowercase, numbers, symbols)", "different from previous
#    passwords", "not a single recognizable word or your username", passphrases
#    preferred (15+ encouraged). The live policy allowed length 7 — below
#    standard. AD `complexity = on` enforces the 3-of-4 categories + not-username
#    rule; history (below) enforces "different from previous".
#
#    NOTE — what AD can't do: the "not a recognizable dictionary word" + breached-
#    password screening UCSD wants is NOT expressible in AD's password policy.
#    That is enforced one layer up by the AUTHENTIK password-strength policy
#    (zxcvbn + HaveIBeenPwned), which is owed in terraform/authentik (see ADR
#    0010 / the cross-layer obligation). Both layers together meet the standard.

# Never expire (0 = unlimited). Was 42.
max_pwd_age: 0

# Minimum length per UCSD AD standard (>=12). Was 7.
min_pwd_length: 12

# AD complexity: characters from 3 of 4 categories + cannot contain
# samAccountName/displayName. Already on; pinned so it can't silently regress.
complexity: "on"

# "Different from any previous passwords" — keep the existing strong history.
history_length: 24

# Minimum age before a user may change again. Keep the live value (anti-rapid-
# cycling). Harmless with no expiry; left managed so it's explicit, not drift.
min_pwd_age: 1

# Account lockout is intentionally NOT managed here (live threshold = 0 / off).
# AD/Kerberos lockout is a double-edged sword (enables targeted user-DoS); SSH
# brute force is already handled by fail2ban + key-only auth, and the perimeter
# firewall source-restricts the AD ports. Revisit as a deliberate decision —
# see ADR 0010 "Out of scope / follow-ups" — rather than flipping it as a
# side effect of the length/expiry change.
