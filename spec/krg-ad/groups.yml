# KRG.LOCAL Active Directory — group definitions (declarative source of truth).
#
# Seeded from the LIVE directory on krg-ldap (2026-06-17, read-only
# `samba-tool group list` + `ldbsearch (objectClass=group)`). These are the
# lab-created groups ONLY — the well-known/builtin AD groups (Domain Admins,
# Account Operators, Enterprise Admins, CN=Builtin\*, …) are created by
# `samba-tool domain provision` and are intentionally NOT listed here (the apply
# never touches them).
#
# OWNERSHIP BOUNDARY (ADR 0010):
#   * Group OBJECTS (existence, scope, category, description) — IaC, this file.
#   * Group MEMBERSHIP of HUMAN accounts — roster (svc_roster), NOT here.
#   * Group MEMBERSHIP of SERVICE accounts — IaC, in service-accounts.yml.
#   * NESTED GROUP membership (a group as a member of another group) — IaC, this
#     file, via a group entry's `members:` list. Put GROUP names ONLY there
#     (builtin groups like "Domain Admins" are fine as members); HUMAN members
#     still belong to roster. `members` is a structural relationship between
#     group objects, so it lives with the objects.
# Consequently the apply is NON-AUTHORITATIVE on membership: it creates groups
# and ADDS any `members:` entries, but NEVER reconciles their member lists, so it
# can never delete a roster-set human member (nor a nested group it once added).
# It also never deletes a group that is absent from this file (drift is reported,
# not enforced) — deleting an AD group is destructive and stays a deliberate
# human action.
#
# All live custom groups are Global Security groups (groupType -2147483646 =
# 0x80000002), created flat under CN=Users (no custom OUs exist yet).
#
# `description` is applied ONLY at group-creation time (samba-tool group add
# --description). Existing groups keep whatever description they have — the apply
# does not rewrite it (would need ldbmodify; deliberately out of scope, see the
# role README). Descriptions left blank below are ones whose purpose was not
# verifiable from the repo at seeding time — fill them in before relying on them.

container: "CN=Users,DC=krg,DC=local"
scope: global # all live custom groups are global security groups
category: security

groups:
  # --- Host / capability access groups (consumed by nix krg.adClient + ad-group-sync) ---
  - { name: "Waiter", description: "Login access to the waiter compute host (krg.adClient.allowedGroups)" }
  - { name: "GPU Users", description: "GPU device access on compute hosts (nvidia.nix cudaAccessGroups -> ad-group-sync)" }
  - { name: "Docker Users", description: "docker daemon access on hosts (docker.nix accessGroups -> ad-group-sync)" }
  - { name: "KastnerML", description: "Access to the kastner-ml host" }
  # Space-FREE name on purpose (like proxmox-admins): consumed as `%E4E-NAS` in a
  # sudoers rule (nix krg.nasMount) where an unescaped space would break the rule,
  # and looked up by name in Authentik (terraform/authentik app_access.tf).
  # `members: [E4E Admin]` — E4E administrators inherit E4E NAS mount access
  # (nested), so they don't need a separate direct grant.
  - { name: "E4E-NAS", description: "Mount access to the E4E NAS (e4e-nas.ucsd.edu) CIFS shares via the kastner-ml e4e-nas-mount sudo wrapper (nix krg.nasMount); also gates the E4E NAS app tile in Authentik (app_access.tf)", members: ["E4E Admin"] }
  # --- e4e-nas per-share grant groups (consumed by spec/e4e-nas/acls.yml -> synology_acls) ---
  # These replace principals from the DEAD KRG-UCSD-EDU domain, translated from the
  # 2026-05-28 pre-reset capture (`synoshare --list_acl`, off-repo per the runbook).
  # All space-free for the same reason as E4E-NAS. None of them grant the *mount* —
  # a member also needs E4E-NAS for the kastner-ml sudo wrapper (nix krg.nasMount).
  #
  # Collapses TWO old principals that agreed on every share: the local DSM group
  # `@fishsense` and the AD group `@KRG-UCSD-EDU\FishSense NAS` (both RW on fishsense +
  # fishsense_data, both RO on fishsense_process_work). DISTINCT from the "FishSense"
  # project group below: project membership != NAS share access.
  - { name: "FishSense-NAS", description: "Access to the FishSense shares on e4e-nas.ucsd.edu: RW on fishsense + fishsense_data, RO on fishsense_process_work (spec/e4e-nas/acls.yml). Mounting also requires E4E-NAS." }
  # <- old `@KRG-UCSD-EDU\Engineers for Exploration NAS Admins` (RW on all 3 FishSense
  # shares). Kept as its own object rather than folded into "E4E Admin": NAS admin is a
  # narrower grant than E4E-admin-generally.
  - { name: "E4E-NAS-Admins", description: "Administrative RW on the E4E NAS project shares (spec/e4e-nas/acls.yml). Narrower than 'E4E Admin' — NAS data admin only. Mounting also requires E4E-NAS." }
  # <- old `@KRG-UCSD-EDU\FishSense Production Admins` (RW on fishsense_process_work only).
  # Load-bearing distinction: FishSense-NAS is only RO on that share, this group is RW.
  - { name: "FishSense-Prod-Admins", description: "RW on the fishsense_process_work share on e4e-nas (spec/e4e-nas/acls.yml), where FishSense-NAS is only RO. Mounting also requires E4E-NAS. Also gates access to the FishSense API app in Authentik (terraform/authentik app_access.tf)." }
  # <- old local DSM groups `@research_support` / `@hardware`. Renamed from the bare
  # `research_support`/`hardware` in spec/e4e-nas/groups.yml: these land flat in
  # CN=Users alongside every other lab group, where those names are too generic to own.
  - { name: "E4E-Research-Support", description: "Research Support Group; RO on the fishsense share on e4e-nas (spec/e4e-nas/acls.yml). Mounting also requires E4E-NAS." }
  - { name: "E4E-Hardware", description: "E4E Hardware Team; RW on the fishsense share on e4e-nas + owns hardware_dev (spec/e4e-nas/acls.yml). Mounting also requires E4E-NAS." }
  # NOTE: old `@leads` maps onto the EXISTING "e4e-project-lead" group below, not a new
  # object — same set (E4E project leads). No `leads` group is created.
  # NEW (not from the capture): governs the new `junkyard` share (/volume2/junkyard,
  # spec/e4e-nas/shares.yml). Space-free like every other NAS grant group. DISTINCT from
  # the pre-existing `junkyard-fishsense` / `junkyard_backup` shares — this group holds no
  # grant on those (they stay absent from acls.yml, so the role leaves them untouched; the
  # `junkyard.service` account decision on junkyard-fishsense is still open).
  - { name: "Junkyard-NAS", description: "RW on the junkyard share on e4e-nas.ucsd.edu (spec/e4e-nas/acls.yml). Mounting also requires E4E-NAS." }

  - { name: "Guacamole Admins", description: "Apache Guacamole administrators" }
  # Space-FREE name on purpose: PVE's AD-realm sync rejects group ids with spaces
  # ([A-Za-z0-9._-]+), so a "Proxmox Admins" group would be skipped on sync. The
  # ansible pve_ad role syncs this group from KRG.LOCAL into PVE and ACLs it
  # Administrator on /. Add hypervisor admins as DIRECT members (PVE sync does not
  # expand nested groups). RENAME NOTE: the old "Proxmox Admins" group (OIDC era) is
  # retired — rename it to this in AD (preserves membership) or move members over,
  # then delete the old one by hand (this apply is non-authoritative; it won't).
  - { name: "proxmox-admins", description: "Administrator on the Proxmox VE web UI + apps via the PVE Active Directory realm (ansible pve_ad). Direct members only." }
  - { name: "Temporal Users", description: "May mint a lab-PKI client cert to reach the Temporal mTLS frontend (OpenBao ldap auth -> pki_int/issue/user; terraform/openbao var.pki_ad_group_roles)" }
  - { name: "Label Studio Admins", description: "Administrator in the Label Studio Enterprise SaaS org via Authentik SAML SSO (terraform/authentik label_studio emits this name in the Groups attribute; map it to the Administrator org role in Label Studio Organization -> Roles)" }
  - { name: "Label Studio Users", description: "Standard (non-admin) access to the Label Studio Enterprise SaaS org via Authentik SAML SSO (terraform/authentik label_studio's Groups mapping emits every name starting with 'Label Studio', so no tofu change is needed; map this name to a standard org role in Label Studio Organization -> Roles)" }
  - { name: "MLflow Users", description: "Standard (non-admin) access to mlflow.krg.ucsd.edu via Authentik OIDC; emitted in the groups claim and matched by the mlflow-oidc-auth OIDC_GROUP_NAME (nix/docker-compose/krg-prod/compose.mlflow.yml)" }
  - { name: "MLflow Admins", description: "Administrator access in MLflow via Authentik OIDC; matched by the mlflow-oidc-auth OIDC_ADMIN_GROUP_NAME" }
  # Space-FREE names on purpose: emitted verbatim in the Authentik `groups` claim
  # (terraform/authentik fishsense_analytics provider) and mapped to Superset roles
  # by name via Flask-AppBuilder AUTH_ROLES_MAPPING (re-synced every login), so the
  # AD group name MUST match the Superset-side mapping key exactly.
  - { name: "fishsense-superset-admin", description: "Admin role in FishSense Superset (analytics.fishsense.e4e.ucsd.edu) via Authentik OIDC; emitted in the groups claim and mapped to the Superset Admin role by AUTH_ROLES_MAPPING" }
  - { name: "fishsense-superset-editor", description: "Editor role in FishSense Superset (analytics.fishsense.e4e.ucsd.edu) via Authentik OIDC; emitted in the groups claim and mapped to a Superset editor role by AUTH_ROLES_MAPPING" }
  - { name: "fishsense-superset-viewer", description: "Viewer role in FishSense Superset (analytics.fishsense.e4e.ucsd.edu) via Authentik OIDC; emitted in the groups claim and mapped to a Superset viewer role by AUTH_ROLES_MAPPING" }
  # Same space-free reason: emitted verbatim in the Authentik `groups` claim (the
  # fishsense_oauth provider now carries the `groups` scope too, applications_e4e.tf)
  # and matched by name in the FishSense web app. Gates the AUTHENTICATED PORTAL at
  # fishsense.e4e.ucsd.edu/portal, where a dive's calibration_dive_id can be set —
  # that feeds fish-length measurement, so it is the FishSense team, not everyone
  # with a realm account. The gate FAILS CLOSED: no group -> no portal. NOT an app
  # gate — reaching the site at all still needs the "FishSense" group (or a
  # fishsense-tenant collaborator attribute), see terraform/authentik/app_access.tf.
  - { name: "fishsense-portal-admin", description: "Write access to the FishSense web portal (fishsense.e4e.ucsd.edu/portal) — may set a dive's calibration_dive_id, which feeds fish-length measurement. Emitted in the Authentik groups claim (fishsense_oauth provider) and matched by name in-app; the check fails closed. Site access itself is gated separately on the FishSense group." }

  # --- Lab / org groups ---
  - { name: "Kastner Research Group", description: "Kastner Research Group members; owns /scratch/krg (gid group)" }
  - { name: "Kastner Research Group PhD Students", description: "KRG PhD students" }
  - { name: "Engineers for Exploration", description: "Engineers for Exploration (E4E) members" }
  # E4E Admin is the E4E administrator tier. `members: [Domain Admins]` folds the
  # directory admins in (they're E4E admins too); E4E Admin is in turn a nested
  # member of "E4E Garage Admins" and "E4E-NAS" (declared on those groups), and
  # gets sudo on kastner-ml (nix krg.adClient.sudoGroups).
  - { name: "E4E Admin", description: "E4E administrators", members: ["Domain Admins"] }
  - { name: "E4E Garage Admins", description: "E4E Garage (S3/object-store) administrators", members: ["E4E Admin"] }
  - { name: "e4e-project-lead", description: "E4E project leads" }

  # --- E4E project groups ---
  - { name: "FishSense", description: "E4E FishSense project" }
  - { name: "Smartfin", description: "E4E Smartfin project" }
  - { name: "Acoustic Species", description: "E4E Acoustic Species ID project" }
  - { name: "Mangrove Monitoring", description: "E4E Mangrove Monitoring project" }

  # --- Needs confirmation (description intentionally omitted so the apply leaves them untouched) ---
  # `MangroveMonitoring` (no space) co-exists with `Mangrove Monitoring` (with space) in the
  # live directory — almost certainly a duplicate/typo. Listed so it is tracked, NOT auto-deleted
  # (non-authoritative). Reconcile membership onto one, then delete the other BY HAND.
  - { name: "MangroveMonitoring" } # TODO: dedupe vs "Mangrove Monitoring"
  - { name: "fuzzy" } # TODO: confirm purpose/owner before documenting
