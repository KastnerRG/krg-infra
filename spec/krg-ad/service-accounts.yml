# KRG.LOCAL Active Directory — service (non-human) accounts (source of truth).
#
# Seeded from the live directory on krg-ldap (2026-06-17, read-only). These are
# the NON-human principals — automation/bind accounts. Human accounts and their
# group memberships are owned by ROSTER (svc_roster), not this repo (ADR 0010).
#
# SECRETS: passwords are NEVER in this file. The apply does NOT auto-create a
# missing service account (creation needs a password, which lives in OpenBao and
# is consumed by the service that binds with it). A missing account is reported
# as a FAILURE with remediation — create it out-of-band and store its password
# in OpenBao, then the account is a no-op here forever after. `member_of` IS
# managed here (service-account membership is IaC) and is applied NON-
# AUTHORITATIVELY (members are only added, never removed).

accounts:
  - name: authentik-bind
    description: "Authentik LDAP-source bind account — reads/syncs KRG.LOCAL and writes password changes back to AD"
    # No group membership. Its write capability is a SCOPED ACL delegation
    # (Reset Password on CN=Users), declared in acls.yml — NOT broad group
    # membership. This is what fixes self-service password change in Authentik
    # (insufficientAccessRights / LDB_MODIFY 50 before the delegation).
    member_of: []

  - name: svc_roster
    description: "Roster automation service account — provisions human accounts + group memberships"
    # Roster's write capability comes from Account Operators membership (a
    # builtin group that can create/manage user + group accounts). This is the
    # one place the IaC asserts a service account into a builtin group; it is
    # additive (the apply never removes it from other groups).
    member_of:
      - "Account Operators"

  - name: svc-openbao
    description: "OpenBao LDAP-auth bind account — read-only directory search for the lab PKI <-> AD integration (terraform/openbao/ldap.tf)"
    # READ-ONLY: OpenBao's `ldap` auth method binds as this account to search
    # users/groups so AD-group membership can authorize pki_int/issue/* (the
    # human cert-issuance path; machines use AppRole). A default authenticated AD
    # principal can already READ user/group objects + memberOf, so it needs NO
    # group membership and NO ACL delegation (unlike authentik-bind, which writes
    # password resets). The bind DN the OpenBao config uses is
    # CN=svc-openbao,CN=Users,DC=krg,DC=local (var.ldap_binddn).
    #
    # As with every account here, this declares the OBJECT only — the apply does
    # NOT create it or set a password. Create it out-of-band and store the
    # password in OpenBao (consumed at apply time as TF_VAR_ldap_bindpass in the
    # operator's shell, never committed). See docs/pki-ad-integration.md.
    member_of: []
