# OpenVPN remote access on e4e-nas — declarative source of truth.
#
# Consumed by the `synology_vpn` Ansible role. ⚠️ THAT ROLE DOES NOT EXIST YET —
# this file is the declared target; nothing applies it until the role lands (see
# "Bring-up sequence" at the bottom). The DSM package install is already IaC
# (terraform/e4e-nas/packages.tf → `synology_core_package "VPNCenter"`).
#
# PURPOSE — a deliberately tiny remote-access path for SMB, and nothing else.
# Researchers off campus need to mount e4e-nas shares. The requirement is NOT
# "a campus VPN": clients must reach *this NAS on port 445* and have no route to
# anything else. Terminating the tunnel on the NAS itself is what makes that
# true by construction — the NAS is an endpoint, not a gateway, so there is no
# forwarding path to the 132.239.17.0/24 campus network behind it.
#
# THREAT MODEL / non-goals, stated so nobody "helpfully" widens this later:
#   * NOT a general campus VPN. No `redirect-gateway`, no LAN route push, no DNS
#     push. A client's non-SMB traffic never enters the tunnel.
#   * NOT a pivot. `allow_lan: false` below is LOAD-BEARING — flipping it makes
#     the NAS a router onto the flat-public campus subnet
#     ([[sealab-flat-public-no-nat]]: there is no private LAN here, so "server's
#     LAN" means *campus*).
#   * NOT an access-control layer. VPN privilege grants tunnel reach to :445
#     only; what a user can actually read is still the per-share ACL matrix in
#     acls.yml, exactly as it is for an on-campus mount.
#
# DSM API surface — ⚠️ PARTIALLY UNCONFIRMED. Discovery run 2026-08-13 against
# the live box (DSM 7.3.2-86009 Update 4) established:
#   CONFIRMED
#     * Package id is `VPNCenter` ("VPN Server" 1.4.10-2984), present in this
#       model's feed (synology_broadwell_3617xs), not deprecated, NOT installed.
#     * `SYNO.Core.Security.Firewall.Adapter list` already returns a `vpn`
#       adapter (eth0..eth3, global, pppoe, vpn, wlan0) *before* the package is
#       installed — so the isolation control needs no new API, just a `vpn`
#       block in security.yml (added in the same commit as this file).
#     * `SYNO.Core.AppPriv.Rule` (get/set/delete/list v1) is the per-application
#       privilege surface and it RESOLVES AD GROUPS. Live example on this box:
#         {"app_id":"SYNO.SDS.Drive.Application","entity_type":"group",
#          "entity_name":"KRG\\Domain Admins","allow_ip":["0.0.0.0"],"deny_ip":[]}
#       Rule shape: {app_id, entity_type, entity_name, allow_ip[], deny_ip[]}.
#       `list` REQUIRES app_id (bare list → err 3400). App ids + their
#       `grant_by_default` come from `SYNO.Core.AppPriv.App list` v3.
#       NOTE: this does NOT contradict ad.yml's "DSM 7.3 has no AD-group
#       mechanism" — that finding is about the NAS-ADMIN TIER. Per-app
#       privilege is a different, working surface. See [[dsm-apppriv-rule-accepts-ad-groups]].
#     * `KRG\Domain Users` resolves on the NAS (`SYNO.Core.Group list
#       type=domain` returns 55 domain groups incl. Domain Users) — which is
#       what makes the privilege block below a single static rule.
#   CONFIRMED 2026-08-16, after the package installed (deploy run 31918131532):
#     * API surface, read from /var/packages/VPNCenter/target/webapi/
#       SYNO.VPNServer.lib. ⚠️ The verbs are **load/apply**, NOT the get/set
#       every other synology_* role wraps:
#         SYNO.VPNServer.Settings.Config        status_load | load | apply
#         SYNO.VPNServer.Settings.Certificate   export
#         SYNO.VPNServer.Management.Account     load | apply   ← privilege
#         SYNO.VPNServer.Management.Interface   load | apply
#         SYNO.VPNServer.Management.Connection  enum | kick
#         SYNO.VPNServer.Management.Log         load | clear | export
#     * INFO gives dsmappname="SYNO.SDS.VPN.Instance" — the likely AppPriv id,
#       though privilege looks like it belongs on Management.Account instead.
#     * The package stays STOPPED after install (`synopkg is_onoff` → "isn't
#       turned on, status: [262]") until a protocol is enabled. This confirms
#       "inert until configured" more strongly than first written: nothing
#       listens because nothing RUNS.
#   PENDING (chicken-and-egg — a STOPPED package does not register its webapi,
#   so every SYNO.VPNServer.* call returns err 102 until something starts it,
#   and the thing that starts it is this role):
#     * the field names for every key under `openvpn:` below. Treat them as
#       INTENT, not confirmed wire names. `synology_vpn`'s `package` subcommand
#       starts the package; `--tags export` then dumps the live `load` payload,
#       which IS the schema. Flip OUT_KEYS in apply_vpn.py to match — the same
#       pattern apply_ad.py / apply_external_access.py already use. The script
#       fails loudly on a stale mapping rather than configuring nothing.

# --- Protocols -----------------------------------------------------------------
# DSM's VPN Server offers three. Only OpenVPN is acceptable:
#   pptp  — MS-CHAPv2/MPPE, cryptographically broken (recoverable in hours).
#   l2tp  — needs a *shared* PSK across all clients; a leaked PSK is a silent
#           downgrade of the whole service, and it has no per-user story.
# Both stay explicitly off so the spec kills them if a UI click ever enables one.
pptp:
  enable: false
l2tp:
  enable: false

openvpn:
  enable: true

  # Transport. UDP is the right default for a file-copy workload (TCP-over-TCP
  # meltdown on lossy links); 1194 is the IANA-registered port. The matching
  # inbound allow lives in security.yml (`openvpn-1194` rule in the `global`
  # block) — BOTH must be flipped together, and the firewall side ships
  # disabled in this PR. See "Bring-up sequence".
  port: 1194
  protocol: udp

  # Tunnel subnet. Deliberately NOT OpenVPN's 10.8.0.0/24 default: clients are
  # on home/hotel networks and a collision with the client's own LAN silently
  # breaks routing on that client only (miserable to diagnose remotely).
  # 10.90.24.0/24 is unlikely to collide with consumer CPE defaults
  # (192.168.0/1.x, 10.0.0/1.x, 172.20.10.x tethering).
  # The NAS takes .1 — that is the address clients mount:  \\10.90.24.1\<share>
  subnet: 10.90.24.0
  netmask: 255.255.255.0

  # Concurrency. E4E is small; this is a backstop against a runaway client, not
  # a capacity plan. Raise if it ever actually binds.
  # (DSM ships `max-clients 5` — confirmed on-box 2026-08-16. Real drift.)
  max_connections: 20

  # Multiple concurrent tunnels per AD account — laptop AND phone. DSM ships
  # this ON (`duplicate-cn` + `username-as-common-name` in the stock
  # openvpn.conf), and for a share-mounting service the convenience is worth
  # more than the per-user session accountability you give up. Flip to false if
  # "one session per account" ever matters; note the audit trail then comes
  # from the connection log (Management.Connection enum), not from the tunnel.
  duplicate_cn: true

  # --- The isolation switches (the whole point of this file) -----------------
  # ⚠️ LOAD-BEARING. `true` makes DSM enable ip_forward + MASQUERADE and push a
  # route for the server's LAN — i.e. it turns e4e-nas into a router onto the
  # public campus subnet for every VPN client. This must stay false. If someone
  # opens a ticket asking for "access to other lab machines over the VPN", the
  # answer is a separate VPN on a host built for it, NOT this flag.
  allow_lan: false

  # No DNS push: clients keep their own resolver. Pushing the KRG.LOCAL DC as a
  # resolver would (a) leak internal names + query patterns to arbitrary client
  # networks and (b) be useless anyway, since the DC is not reachable through
  # this tunnel. Consequence, documented for the client runbook: users mount by
  # IP (10.90.24.1), not by FQDN.
  push_dns: false

  # IPv6 off — the tunnel carries one protocol to one host; a v6 path would be a
  # second, unaudited route into the same box.
  ipv6: false

  # --- Crypto ---------------------------------------------------------------
  # AEAD cipher + TLS 1.2 floor. Compression is OFF and must stay off: TLS-level
  # compression with attacker-influenced plaintext is the VORACLE class of
  # attack (CVE-2018-9336 family), and it buys nothing on already-compressed
  # research data.
  #
  # ⚠️ DSM SHIPS `comp-lzo` ON — confirmed by reading the stock openvpn.conf
  # on-box 2026-08-16. So `compression: false` is a REAL drift fix, not a
  # belt-and-braces restatement of a safe default. Don't "simplify" it away.
  cipher: AES-256-GCM
  auth_digest: SHA512
  tls_min_version: "1.2"
  compression: false

  # Control-channel HMAC (`tls-auth ta.key 0`). Packets without a valid HMAC are
  # dropped BEFORE OpenVPN does any TLS work, so internet background scanning
  # and pre-auth TLS-stack CVEs never reach the crypto — the single biggest
  # hardening available for a password-only public endpoint.
  #
  # CORRECTION (2026-08-16): the original version of this file said DSM's
  # OpenVPN "supports neither 2FA nor tls-crypt", implying no pre-TLS gate
  # exists. Half wrong — tls-crypt is indeed absent, but `tls-auth` IS
  # supported: the package's postinst generates keys/ta.key (that's the
  # "--genkey --secret is DEPRECATED" warning in the install log) and
  # target/etc/openvpn/server.conf, target/scripts/openvpn.sh and the client
  # sample all reference `tls-auth ta.key 0`.
  #
  # Cost: ta.key must be embedded in every client config, so the .ovpn becomes
  # a SHARED SECRET rather than a freely publishable file. That is why it is
  # distributed through an authenticated share — see `client:` below.
  tls_auth: true

  # --- Client authentication -------------------------------------------------
  # ⚠️ CORRECTED 2026-08-16. This file previously said auth goes through PAM.
  # It does not. The stock openvpn.conf loads `plugin .../radiusplugin.so` with
  # `verify-client-cert none` + `username-as-common-name`, and the package's
  # bundled FreeRADIUS AD site (etc/syno_conf/rad_site_def_ad) sets
  # `Auth-Type = "ntlm_auth"`. So the real path is:
  #
  #     OpenVPN -> radiusplugin -> local radiusd -> ntlm_auth -> winbind -> DC
  #
  # Practical consequences, all fine but worth knowing:
  #   * It is NTLM to the DC, not Kerberos. Works with the existing AD join
  #     (ad.yml); no keytab or SPN work needed.
  #   * The auth path is INTERNAL to the NAS — the client never talks to the DC,
  #     which is exactly what lets the tunnel stay NAS-only.
  #   * A DC outage takes VPN auth down with it (no offline cache here, unlike
  #     SSSD on the Linux fleet). Same blast radius as the krg-ldap SPOF already
  #     tracked in CLAUDE.md.
  #
  # ⚠️ RESIDUAL RISK, accepted knowingly (2026-08-13, revised 2026-08-16): this
  # publishes a password-authenticated endpoint to the internet, and DSM's
  # OpenVPN supports no 2FA. Brakes that DO apply:
  #   * `tls_auth` above — unauthenticated packets never reach TLS.
  #   * DSM auto-block: 3 attempts / 24h / never expires (security.yml).
  #   * KRG.LOCAL password policy: 12 chars + AD complexity (spec/krg-ad/
  #     password-policy.yml).
  #   * the `openvpn-1194` firewall rule is geoip-scoped to US, matching the
  #     existing `geoip-US-web` posture.
  # AD account lockout is deliberately OFF fleet-wide (password-policy.yml:54),
  # so a spray CANNOT lock users out — but that also means there is no
  # account-level rate limit, only the IP-level auto-block. If this service ever
  # carries more than "mount a share", revisit with a real MFA front door.

  # --- Privilege -------------------------------------------------------------
  # DECISION (2026-08-13): grant to ALL AD users rather than a bespoke VPN
  # group. Every human on this NAS is an AD user already, and VPN privilege only
  # confers reach to :445 — share visibility is still ACL-governed — so a
  # narrower group would add a membership-maintenance chore for no real
  # reduction in blast radius.
  #
  # `KRG\Domain Users` is the AD primary group: every domain user, and — the
  # reason this form was chosen over an `everyone` rule — NO LOCAL ACCOUNTS.
  # That matters: users.yml's `e4e-admin` (break-glass) and `e4e-automation` are
  # both in `administrators`, and SSH is key-only precisely so those accounts
  # have no guessable remote auth path. An `everyone` grant would hand both of
  # them a password-authenticated internet front door and undo that.
  #
  # If this ever needs narrowing, `KRG\E4E-NAS` already exists in AD and is the
  # drop-in replacement — one line, no other change.
  privilege:
    # app_id: PENDING — read from `SYNO.Core.AppPriv.App list version=3` after
    # the package installs (expect a `SYNO.SDS.VPNCenter.*` id). The role must
    # fail loudly rather than guess: a wrong app_id writes a rule that silently
    # governs nothing.
    app_id: ""                                   # ⚠️ fill from discovery
    grant:
      - entity_type: group
        entity_name: 'KRG\Domain Users'
        allow_ip: ["0.0.0.0"]                    # 0.0.0.0 = any source
        deny_ip: []

# --- Client distribution --------------------------------------------------------
# The .ovpn is the SAME file for every user (auth is username/password; there
# are no per-client certs — `verify-client-cert none`). The role RENDERS it
# rather than using DSM's export: DSM's exported config carries a literal
# `YOUR_SERVER_IP` placeholder and its own idea of the parameters, so rendering
# from this spec keeps the shipped file and the server config from drifting
# apart, and guarantees `redirect-gateway` stays commented (split tunnel).
#
# WHERE IT GOES, and why not just a public URL: with `tls_auth: true` the file
# embeds ta.key, which makes it a shared secret — not a per-user credential, but
# the thing that keeps internet scanners off the daemon. So it must reach
# exactly the population allowed to use the VPN and no wider. The `installers`
# share is that boundary: RO to `@users`, RW only to admins, no anonymous
# access (confirmed on-box 2026-08-16 via `synoshare --list_acl installers`).
# Same audience as the `KRG\Domain Users` privilege grant above.
#
# NO CHICKEN-AND-EGG: a user off campus with no tunnel can still fetch it, over
# DSM's web UI / File Station, which security.yml deliberately keeps reachable
# US-wide (`geoip-US-web`, ports 443/6020/6021) and whose app privilege is
# grant_by_default. ⚠️ If that rule is ever narrowed, move this file to a
# genuinely public location FIRST or new users are locked out of onboarding.
client:
  publish: true
  # The address clients dial. Must resolve publicly — this is the tunnel
  # endpoint, not the in-tunnel address.
  public_host: e4e-nas.ucsd.edu
  # The in-tunnel address of the NAS: what users actually mount
  # (\\10.90.24.1\<share>). It is `subnet` +1 by OpenVPN convention; if you
  # change `openvpn.subnet` above, change this AND the `vpn-smb-only` firewall
  # rule's source_ip in security.yml.
  vpn_ip: 10.90.24.1
  publish_to: /volume1/installers/e4e-nas-vpn.ovpn
#
# SMB AUTH THROUGH THE TUNNEL — validate on bring-up. Clients cannot reach the
# DC (that is the design), so Kerberos SPN acquisition will fail and clients
# fall back to NTLMv2, which the NAS pass-through-authenticates to krg-ldap over
# its OWN network path. That works, but smb-globals.yml sets min_protocol SMB3 +
# server_signing + ntlmv1_auth false, so the fallback path must be tested on a
# real Windows and a real macOS client before this is announced. Windows tries
# Kerberos first whenever it can resolve an SPN.

# --- Bring-up sequence ----------------------------------------------------------
#   1. ✅ DONE (#522, deployed 2026-08-16 run 31918131532) — `tofu apply`
#      installed VPNCenter. Confirmed inert: package present but NOT running.
#   2. ✅ DONE (2026-08-16) — API surface + shipped openvpn.conf read off the
#      box; findings folded in above. Field names remain PENDING by necessity
#      (see the chicken-and-egg note).
#   3. ✅ DONE (this PR) — `ansible/synology/roles/synology_vpn` built:
#      apply_vpn.py + tests, load→overlay→apply, script:+raw per
#      [[synology-script-raw-pattern]], FAIL/CHANGED sentinels per
#      [[synology-script-fail-sentinel-pty-merge]]. Composed into synology_base
#      AFTER synology_ad — the privilege grant references domain principals.
#   4. ⬜ FIRST APPLY — OPT-IN ONLY. The role ships gated OFF
#      (`synology_vpn_enabled: false`) because CD applies this play
#      UNATTENDED on merge, and an unreconciled OUT_KEYS fails the play and
#      blocks the deploy phases behind it. See "merging IS applying" in
#      CLAUDE.md. Drive it by hand:
#          ansible-playbook playbook.yml -e synology_vpn_enabled=true --check --diff
#          ansible-playbook playbook.yml -e synology_vpn_enabled=true
#          ansible-playbook playbook.yml -e synology_vpn_enabled=true --tags export
#      Then reconcile OUT_KEYS in apply_vpn.py against the exported payload and
#      re-run until the openvpn step reports `OK no-change`, THEN flip
#      synology_vpn_enabled to true in the role defaults.
#   5. ⬜ Fill in the privilege mapping. The `privilege` subcommand is gated off
#      (`synology_vpn_privilege_enabled`) and dumps LIVE-ACCOUNT-OBJECT rather
#      than guessing at an access-control payload. Wire it, then enable.
#   6. ⬜ Flip `enable: true` on BOTH firewall rules in security.yml
#      (`openvpn-1194` in `global`, `vpn-smb-only` in the `vpn` adapter). This
#      is the step that actually exposes the service — do it last, and only
#      after step 5, or the VPN is reachable before privilege is scoped.
#   7. ⬜ Validate: connect; confirm `\\10.90.24.1\<share>` mounts; confirm the
#      client has NO route to any other campus host (traceroute to
#      krg-prod.ucsd.edu must not traverse the tunnel); confirm the DSM UI on
#      :6021 is NOT reachable over the tunnel; confirm ping to 10.90.24.1 fails
#      (ICMP is dropped by the `vpn` adapter — expected, not a fault).
