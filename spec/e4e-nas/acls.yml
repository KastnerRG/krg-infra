# Per-share ACLs (the share -> principal grant matrix) on e4e-nas — source of truth.
# Consumed by the `synology_acls` role, which wraps `synoshare --setuser` (validated on
# the DSM 7.3 rig). Git is truth; UI = drift (ADR 0001).
#
# Each grant names a `group` (applied @-prefixed; a bare group name silently no-ops on DSM)
# or a `user`, with `access: rw | ro | no` (-> DSM tiers RW/RO/NA). The grant list is
# AUTHORITATIVE: a principal omitted from a share's grants is REMOVED — so include
# `administrators` explicitly where it should keep access (a fresh share defaults to
# `@administrators` RW).
#
# ⚠️ AD GROUPS MUST BE DOMAIN-QUALIFIED: `KRG\<name>` (the role prepends only `@`, giving
# `@KRG\<name>`). An UNQUALIFIED name is resolved by DSM as a LOCAL group — if no such
# local group exists, `synoshare --setuser` still returns 0 and the entry is SILENTLY
# DROPPED. It looks applied (ansible reports `changed`) and simply isn't there.
#   * AD group    -> `KRG\FishSense-NAS`      (quote it: the backslash needs YAML quoting)
#   * local group -> `administrators`          (bare)
# The 2026-05-28 capture shows both forms side by side: `@KRG-UCSD-EDU\FishSense NAS` (AD)
# next to `@fishsense` / `@administrators` (local). The ad.yml `admin_groups` bridge does
# this prefixing itself (synology_acls/tasks/main.yml derives the NetBIOS name from
# ad.yml `realm`), which is why `@KRG\Domain Admins` lands correctly while a bare AD name
# here would not. TODO: teach the setuser path the same realm-derivation so `KRG\` isn't
# hardcoded in this file — until then, keep it in sync with ad.yml `realm`.
#
# Schema:
#   acls:
#     - share: maya
#       grants:
#         - { group: maya, access: rw }
#         - { group: leads, access: ro }
#         - { user: someuser, access: rw }
#
# ✅ 2026-05-28: PRE-RESET CAPTURE TAKEN — all 55 live shares' grants captured via
# `synoshare --list_acl` (read-only). Archived locally (off-repo, since it's audit data,
# not repo material). That capture is the authoritative REFERENCE but is NOT pasted here
# verbatim, because many grants reference the DEAD old domain (e.g.
# `KRG-UCSD-EDU\Engineers for Exploration NAS Admins`). Those principals won't exist after
# the Mode-2 reset + KRG.LOCAL join — committing them as desired state would encode dead
# SIDs back into the spec.
#
# TODO (post-AD-join, before applying synology_acls):
#   1. Map dead `KRG-UCSD-EDU\…` group refs in the capture to their KRG.LOCAL equivalents
#      (largely the groups.yml set + the local `administrators`).
#   2. Decide which per-user grants (service-account NA deny lists, etc.) carry over and
#      to which new user objects.
#   3. Populate the `acls:` list below; the role and drift detector then enforce it.
#   4. Separately, run the recursive on-disk re-apply (`synoacltool` per share) for
#      preserved data carrying dead SIDs (runbook post-join step, not this role).

defaults:
  # Recursive filesystem-ACL stamp (synoacltool -reset -R) — runbook §4.
  # The role only runs this with `--tags acls-recursive` even when true here
  # (expensive: walks entire share tree). Operator workflow: flip to true,
  # apply once with --tags acls-recursive post-AD-join, leave on (idempotent).
  apply_recursive: false           # flip to true post-AD-join, then run with the tag

# Populated from the capture + dead-SID translation, post-AD-join. Only the FishSense
# shares are done so far; every other share is still un-ported (absent here = untouched
# by the role, since it only reconciles shares listed below).
#
# GROUPS-ONLY (decision 2026-07-16): the per-user ACEs in the capture are deliberately
# NOT carried over. The old rows named ~12 individuals directly (t.yang, dmathews,
# s.aryal, shperry, z.lawrence, j.he, k.han, tzhang, a.panthi, r.rai, n.hui_ro,
# a.budhathoki, s.shrestha) plus service/machine principals (fs_services, kastner-ml,
# junkyard.service, label_studio, minio, e4e_maestro, j.kumagai, nthui_test). Access is
# via groups now: those humans get access by being put in FishSense-NAS (roster owns
# human membership — ADR 0010), not by a named ACE here.
#
# Dropping those per-user ACEs revokes nothing: as of 2026-07-16 NOBODY has access to
# these shares yet (this is bring-up, not a migration of live access — the capture is
# PRE-reset state). So this is a greenfield grant, and apply order is not load-bearing.
# The individuals above regain access by being added to FishSense-NAS, whenever roster
# gets to it. Re-read this note before REusing these rows as a pattern on a share that
# does have live users — there the revocation would be real.
#
# Ordering is still worth knowing (benign): if synology_acls somehow runs before
# ansible/krg-ad creates the groups, the grants name principals DSM can't resolve.
# ANSWERED THE HARD WAY (2026-07-17): DSM does NOT error — `synoshare --setuser` returns
# 0 and silently drops the unresolvable entry, so ansible reports `changed` and the grant
# simply isn't there. deploy/deploy-ansible.sh runs the synology block BEFORE the krg-ad
# block, so this is guaranteed on any deploy that introduces a new AD group: the ACLs are
# written ~20s before the groups exist. Re-running once the groups exist converges it.
#
# SERVICE ACCOUNTS ARE A KNOWN GAP: the capture's NA (deny) ACEs — junkyard.service,
# label_studio, minio, e4e_maestro — are dropped along with the other per-user grants.
# Deny-by-omission is equivalent here ONLY because none of those principals is in any
# group granted below; re-verify that before applying, and if any service account needs
# real access, add it to spec/krg-ad/service-accounts.yml and grant it explicitly.
acls:
  # RW: FishSense-NAS <- @fishsense + @KRG-UCSD-EDU\FishSense NAS (collapsed; agreed on
  # every share). E4E-NAS-Admins <- @KRG-UCSD-EDU\Engineers for Exploration NAS Admins.
  # `administrators` is listed explicitly on every row — the grant list is authoritative,
  # so omitting it would strip DSM admin access. It is the one BARE name here: it's the
  # DSM-LOCAL admin group. Everything else is an AD group and so is `KRG\`-qualified.
  - share: fishsense
    path: /volume1/fishsense
    grants:
      - { group: administrators, access: rw }
      - { group: 'KRG\FishSense-NAS', access: rw }
      - { group: 'KRG\E4E-NAS-Admins', access: rw }
      - { group: 'KRG\E4E-Hardware', access: rw } # <- @hardware (was a LOCAL group pre-reset)
      - { group: 'KRG\E4E-Research-Support', access: ro } # <- @research_support (ditto)
      - { group: 'KRG\e4e-project-lead', access: ro } # <- @leads (ditto)
  - share: fishsense_data
    path: /volume2/fishsense_data
    grants:
      - { group: administrators, access: rw }
      - { group: 'KRG\FishSense-NAS', access: rw }
      - { group: 'KRG\E4E-NAS-Admins', access: rw }
  # NOTE the inversion, faithful to the capture: FishSense-NAS is RO here (both old
  # FishSense principals were RO on this share), and only the prod admins get RW.
  - share: fishsense_process_work
    path: /volume2/fishsense_process_work
    grants:
      - { group: administrators, access: rw }
      - { group: 'KRG\E4E-NAS-Admins', access: rw }
      # This row is what svc_fishsense needs: it is a member of FishSense-Prod-Admins
      # (spec/krg-ad/service-accounts.yml), and without this grant its database_backups
      # writes fail with FileStation err=407 "operation not permitted".
      - { group: 'KRG\FishSense-Prod-Admins', access: rw } # <- @KRG-UCSD-EDU\FishSense Production Admins
      - { group: 'KRG\FishSense-NAS', access: ro }
  # junkyard-fishsense is intentionally NOT listed: no FishSense principal held a grant
  # on it (old row was junkyard.service + admins + E4E NAS Admins). Porting it needs the
  # junkyard.service account decision, so the share is left untouched for now.

# Per-share schema (when populating):
#   - share: maya
#     path: /volume1/maya            # optional; defaults to /volume1/<share>
#     apply_recursive: true           # optional per-share override of defaults
#     grants:
#       - { group: maya, access: rw }
#       - { group: leads, access: ro }
