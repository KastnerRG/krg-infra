# Static PWA server for the production web image (web/Dockerfile).
# Behind the slot's inner Traefik, which sends every non-/api path here.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # SPA fallback: any path that isn't a file is a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The service worker and its manifest must never be cached by the browser/HTTP
    # layer, or a new release never reaches installed PWAs (vite-plugin-pwa's
    # registerType=autoUpdate relies on re-fetching sw.js).
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        # nginx's mime.types has no .webmanifest (it served application/octet-stream).
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
