name: Deploy

# Converges the reference-manager Incus slot after an `auto-deploy/*` PR (opened by
# release.yml) is merged. Mirrors fishsense-services' deploy.yml; every operational
# note below is that repo's, learned on the fishsense slot.
#
#   auto-deploy/*  -> `deploy-incus`: the slot's own self-hosted runner starts
#   `reference-manager-selfupdate`, which runs
#     nixos-rebuild switch --flake github:UCSD-E4E/e4e-reference-manager#reference-manager --refresh
#   converging the slot onto the committed flake.nix + deploy/incus/ interior.
#
# The converge is a TRIGGER, not a CI gate: `reference-manager-selfupdate` stops the
# GitHub runner mid-switch and restarts it after, so the job starts the unit with
# `--no-block`. `verify-incus` is the deploy gate: it asserts the pins the slot
# actually deployed match main's, and that the stack unit came up.
#
# Do NOT "verify" a deploy with `systemctl status reference-manager-selfupdate` — its
# exit code is not a deploy signal: `switch-to-configuration` exits 4 if any unit is
# `failed`, including one it never touched.

on:
  pull_request:
    types: [closed]
    branches: [main]
  # Manual re-converge without a pin bump — e.g. a config-only change under
  # deploy/incus/ (traefik-dynamic.yml, secrets.nix) that release.yml never touches.
  workflow_dispatch: {}

permissions: {}

jobs:
  deploy-incus:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.head_ref, 'auto-deploy/'))
    runs-on: [self-hosted, reference-manager] # the label the platform sets on our runner
    permissions: {}
    # Queue, don't cancel: a cancelled converge would leave the slot on an older main.
    concurrency:
      group: deploy-incus
      cancel-in-progress: false
    steps:
      - name: Converge the instance
        # --no-block: the unit's first action stops the very runner executing this job,
        # so a blocking start is SIGINT'd (exit 130, false red) on a slow rebuild.
        run: systemctl start --no-block reference-manager-selfupdate # polkit-authorized on the slot

  verify-incus:
    # Runs on the slot's own runner on purpose: the converge stops it and starts it
    # again on the way out, so this can't be dispatched until the converge is done —
    # and if the converge leaves the runner dead, this times out red.
    needs: deploy-incus
    if: needs.deploy-incus.result == 'success'
    runs-on: [self-hosted, reference-manager]
    permissions: {}
    timeout-minutes: 25
    concurrency:
      group: verify-incus
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Assert every pin main asked for is the pin that deployed
        run: |
          set -euo pipefail
          SYSTEMCTL=/run/current-system/sw/bin/systemctl

          for i in $(seq 1 40); do
            state=$("$SYSTEMCTL" is-active reference-manager-selfupdate 2>/dev/null || true)
            [ "$state" != "activating" ] && break
            echo "[$i/40] converge still running..."
            sleep 15
          done

          # The compose spec the stack unit actually deployed (its ExecStart names the
          # store path; /nix/store is world-readable). Not `docker ps` (the runner
          # isn't in the docker group, by design).
          deployed_compose=$("$SYSTEMCTL" show reference-manager.service -p ExecStart --value \
            | grep -oE '/nix/store/[a-z0-9]{32}-source/deploy/incus/compose.yml' \
            | head -1)
          if [ -z "$deployed_compose" ] || [ ! -r "$deployed_compose" ]; then
            echo "::error title=Deploy verify::could not read the deployed compose spec from reference-manager.service ExecStart"
            exit 1
          fi

          # [a-z0-9-]: the image names contain a digit (e4e-…).
          pins() { grep -oE 'ghcr\.io/ucsd-e4e/[a-z0-9-]+:v[0-9]+\.[0-9]+\.[0-9]+' "$1" | sort -u; }
          pins "$deployed_compose" > /tmp/deployed-pins.txt
          pins deploy/incus/compose.yml > /tmp/expected-pins.txt

          if [ ! -s /tmp/expected-pins.txt ]; then
            echo "::error title=Deploy verify::no pins found in deploy/incus/compose.yml — refusing to pass vacuously"
            exit 1
          fi
          echo "--- expected (main) ---"; cat /tmp/expected-pins.txt
          echo "--- deployed (slot) ---"; cat /tmp/deployed-pins.txt

          # Compared as strings: the slot runner's PATH has no diffutils (fishsense's
          # first live run red on `diff`). Check anything added here against that PATH.
          if [ "$(cat /tmp/expected-pins.txt)" != "$(cat /tmp/deployed-pins.txt)" ]; then
            echo "::error title=Deploy verify::the slot is NOT running the versions on main; check 'journalctl -u reference-manager-selfupdate' on the slot."
            comm -3 /tmp/expected-pins.txt /tmp/deployed-pins.txt
            exit 1
          fi

          # Pins match — but the spec is only live if the stack unit brought it up
          # (a failed migration fails the whole `up`).
          result=$("$SYSTEMCTL" show reference-manager.service -p Result --value)
          state=$("$SYSTEMCTL" show reference-manager.service -p ActiveState --value)
          echo "reference-manager.service: ActiveState=$state Result=$result"
          if [ "$result" != "success" ]; then
            echo "::error title=Deploy verify::pins match but the compose stack unit is $state/$result"
            exit 1
          fi
          echo "### ✅ deploy verified: $(wc -l < /tmp/expected-pins.txt) pins match main, stack $state/$result" >> "$GITHUB_STEP_SUMMARY"
